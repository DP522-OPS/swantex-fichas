                                placeholder="Detalles de tejeduría, caídas de máquina, pruebas térmicas, ajustes de tensión…"
                                style={{minHeight:80, borderRadius:10, resize:'vertical', color:'#d1d5db', fontWeight:500}}
                            />
                        </div>
                    </div>
                )}
            </div>
        );
    };

    /* ══════════════════════════════════════════
       COMPONENTE FIBRA CARD
    ══════════════════════════════════════════ */
    const FibraCard = ({ f, fi, sid, dW, onUpdate, onRemove, canRemove, sugerido, totalAlim }) => {
        const tituloOptions = [...new Set(HILOS_DB.filter(p=>p.tipo===f.nombre).map(p=>p.titulo))];
        const loteOptions   = HILOS_DB.filter(p=>p.tipo===f.nombre && p.titulo===f.titulo).map(p=>p.lote);
        const rigid = isRigid(f);
        const gr = dW * (f.porcentaje/100);
        const cost = (gr/1000) * (parseFloat(f.costoKg)||0);
        const col = COLORS_BY_TYPE[f.nombre]||'#6b7280';
        // Composición sugerida
        const dtexVal    = getDtexEfectivo(f.nombre, f.titulo);
        const esSp       = esSpandexDesnudo(f.nombre, f.titulo);
        const hayTitulo  = f.titulo && f.titulo!=='';
        const diffSug    = sugerido !== null && sugerido !== undefined && hayTitulo && sugerido !== f.porcentaje;
        const nombreEtiq = NOMBRE_ETIQUETA[f.nombre] || f.nombre;

        return (
            <div className="fiber-card" style={{borderLeft:`3px solid ${col}`}}>
                {canRemove && (
                    <button className="no-print"
                        onClick={()=>onRemove(sid, fi)}
                        style={{position:'absolute', top:8, right:8, background:'#dc2626', color:'#fff',
                            border:'none', borderRadius:6, width:22, height:22, cursor:'pointer',
                            display:'flex', alignItems:'center', justifyContent:'center', fontSize:14, lineHeight:1}}>×</button>
                )}

                <div style={{display:'flex', flexDirection:'column', gap:10}}>
                    <div>
                        <label className="field-label">Tipo de fibra</label>
                        <select value={f.nombre} onChange={e=>onUpdate(sid,fi,'nombre',e.target.value)}>
                            <option value="Nylon Tex">Nylon Tex (Texturizado)</option>
                            <option value="Nylon Rig">Nylon Rig (Rígido)</option>
                            <option value="Lycra">Lycra / Spandex</option>
                            <option value="Poliester">Poliéster</option>
                            <option value="Jaspe">Jaspe</option>
                                        <option value="Modal">Modal</option>
                        </select>
                    </div>

                    <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:8}}>
                        <div>
                            <label className="field-label">Título</label>
                            <select value={f.customTitulo?'CUSTOM':f.titulo}
                                onChange={e=>onUpdate(sid,fi,'titulo',e.target.value)}>
                                <option value="">— Seleccionar —</option>
                                {tituloOptions.map(t=><option key={t} value={t}>{t}</option>)}
                                <option value="CUSTOM">Otro…</option>
                            </select>
                            {f.customTitulo && (
                                <input value={f.titulo} placeholder="Título personalizado"
                                    onChange={e=>onUpdate(sid,fi,'titulo_raw',e.target.value)}
                                    style={{marginTop:4, fontSize:12}}/>
                            )}
                        </div>
                        <div>
                            <label className="field-label">Lote / Partida</label>
                            <select value={f.customLote?'CUSTOM':f.lote}
                                disabled={!f.titulo && !f.customTitulo}
                                onChange={e=>onUpdate(sid,fi,'lote',e.target.value)}>
                                <option value="">— Lote —</option>
                                {loteOptions.map(l=><option key={l} value={l}>{l}</option>)}
                                <option value="CUSTOM">Otro…</option>
                            </select>
                            {f.customLote && (
                                <input value={f.lote} placeholder="Lote personalizado"
                                    onChange={e=>onUpdate(sid,fi,'lote_raw',e.target.value)}
                                    style={{marginTop:4, fontSize:12}}/>
                            )}
                        </div>
                    </div>

                    {/* Items S/Z */}
                    <div style={{background:'#0a0e1a', borderRadius:8, padding:10, display:'grid', gridTemplateColumns: rigid?'1fr':'1fr 1fr', gap:8}}>
                        {rigid ? (
                            <div>
                                <label className="field-label">Item (Rígido)</label>
                                <input value={f.itemS} onChange={e=>onUpdate(sid,fi,'itemS',e.target.value)} placeholder="Código item"/>
                            </div>
                        ) : (
                            <>
                                <div>
                                    <label className="field-label" style={{color:'#3b82f6'}}>
                                        <span style={{background:'#1d4ed8', color:'#bfdbfe', padding:'1px 5px', borderRadius:4, fontSize:9, marginRight:4, fontWeight:900}}>S</span>
                                        Item
                                    </label>
                                    <input value={f.itemS} onChange={e=>onUpdate(sid,fi,'itemS',e.target.value)} placeholder="Item S"/>
                                </div>
                                <div>
                                    <label className="field-label" style={{color:'#6b7280'}}>
                                        <span style={{background:'#374151', color:'#d1d5db', padding:'1px 5px', borderRadius:4, fontSize:9, marginRight:4, fontWeight:900}}>Z</span>
                                        Item
                                    </label>
                                    <input value={f.itemZ} onChange={e=>onUpdate(sid,fi,'itemZ',e.target.value)} placeholder="Item Z"/>
                                </div>
                            </>
                        )}
                    </div>

                    <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:8}}>
                        <div>
                            <label className="field-label" style={{color:'#10b981'}}>% Participación</label>
                            <input type="number" value={f.porcentaje} min="0" max="100"
                                onChange={e=>onUpdate(sid,fi,'porcentaje',e.target.value)}
                                style={{color:'#10b981', fontWeight:800, textAlign:'center'}}/>
                        </div>
                        <div>
                            <label className="field-label">Costo Kg (USD)</label>
                            <input type="number" value={f.costoKg||''}
                                onChange={e=>onUpdate(sid,fi,'costoKg',e.target.value)}
                                placeholder="0.00" style={{textAlign:'center'}}/>
                        </div>
                    </div>

                    <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:8}}>
                        <div>
                            <label className="field-label">Proveedor</label>
                            <input value={f.proveedor} onChange={e=>onUpdate(sid,fi,'proveedor',e.target.value)} placeholder="Ej. Fujian"/>
                        </div>
                        <div>
                            <label className="field-label" style={{color:'#f59e0b'}}>Parte de prenda</label>
                            <select value={f.partePrenda||''} onChange={e=>onUpdate(sid,fi,'partePrenda',e.target.value)}
                                style={{background:'#0d1520', border:'1px solid #2a3a50', color:'#fcd34d', fontWeight:700, fontSize:11}}>
                                <option value=''>— Zona —</option>
                                {['PUÑO 1','PUÑO 2','CUERPO','PIERNA','ENTREPIERNA','CINTURA','BOTA','TALÓN','PUNTA','TODA LA PRENDA'].map(p=>(
                                    <option key={p} value={p}>{p}</option>
                                ))}
                            </select>
                        </div>
                    </div>

                    {/* Mini resumen costo si hay datos */}
                    {gr > 0 && (
                        <div style={{borderTop:'1px solid #1f2937', paddingTop:8, display:'flex', justifyContent:'space-between', alignItems:'center'}}>
                            <span style={{fontSize:9, color:'#4b5563', fontWeight:700, textTransform:'uppercase'}}>Consumo docena</span>
                            <div style={{display:'flex', gap:12}}>
                                <span className="mono" style={{fontSize:11, color:'#d1d5db', fontWeight:700}}>{gr.toFixed(1)} gr</span>
                                {cost > 0 && <span className="mono" style={{fontSize:11, color:'#10b981', fontWeight:700}}>${cost.toFixed(2)}</span>}
                            </div>
                        </div>
                    )}
                </div>
            </div>
        );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
    </script>
</body>
</html>
