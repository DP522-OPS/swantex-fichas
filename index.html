                       torsion=nada. Ocupa casi todo el alto de la celda para que la letra
                       se vea con el mismo protagonismo que el numero del hilo. */
                    const torsionCol = t=> t==='S' ? '#1d4ed8' : t==='Z' ? '#374151' : null;
                    const drawTorsionBadge = (x,y,w,h,torsion)=>{
                        const col = torsionCol(torsion);
                        if(!col) return;
                        const[r,g,b]=h2r(col);
                        doc.setFillColor(r,g,b); doc.roundedRect(x,y,w,h,1,1,'F');
                        const fs = Math.min(w,h)*0.78;
                        B(fs,'#ffffff'); centerText(torsion, x+w/2, y+h/2+0.1);
                    };

                    /* page width/height aware helpers */
                    let isLandscape = false;
                    const PGW  = ()=> isLandscape ? LW  : PW;
                    const PGH  = ()=> isLandscape ? LH  : PH;
                    const PGML = ()=> isLandscape ? LML : ML;
                    const PGMR = ()=> isLandscape ? LMR : MR;
                    const PGCW = ()=> isLandscape ? LCW : CW;

                    const footerLine = (pgNum, total) => {
                        const fw=PGW(), fh=PGH(), fml=PGML(), fmr=PGMR();
                        sd('#374151'); doc.setLineWidth(0.25); doc.line(fml,fh-9,fw-fmr,fh-9);
                        N(5.5,'#4b5563');
                        doc.text('Textiles Swantex SAS  ·  Guía de Trabajo Operarios  ·  Sin información de costos', fml, fh-5.5);
                        doc.text(fecha+'  ·  Pág '+pgNum+'/'+total, fw-fmr, fh-5.5, {align:'right'});
                    };

                    /* checkPage: if not enough space, add portrait page and reset y */
                    const checkPage = (y, needed, forcePortrait) => {
                        const safeH = PGH() - 16;
                        if (y + needed > safeH) {
                            footerLine(doc.getNumberOfPages(), '?');
                            if (isLandscape) {
                                doc.addPage('a4','portrait'); isLandscape=false;
                            } else {
                                doc.addPage('a4','portrait');
                            }
                            /* mini-header on new page */
                            if (currentFT) {
                                sf('#0d1520'); doc.rect(ML,MT,CW,8,'F');
                                B(9,'#10b981'); doc.text((currentFT.producto||'').toUpperCase(), ML+3, MT+5.5);
                                B(7,'#fcd34d'); doc.text('LCC: '+(currentFT.lcc||'—'), ML+100, MT+5.5);
                                N(5.5,'#6b7280'); doc.text('FT-CIR-004 · GUÍA OPERARIOS', PW-MR, MT+5.5, {align:'right'});
                            }
                            return MT + 11;
                        }
                        return y;
                    };

                    const parseProg = txt => {
                        if (!txt) return [];
                        return txt.split('\n').filter(l=>l.trim()).map(l=>{
                            const pts=l.split(/[→\-–|·:]/);
                            return { prog:(pts[0]||'').trim(), talla:(pts[1]||'').trim() };
                        });
                    };

                    /* ── DRAW EACH FT004 FICHA ── */
                    ft004Fichas.forEach((ft, fi) => {
                        if (fi>0) {
                            footerLine(doc.getNumberOfPages(),'?');
                            doc.addPage('a4','portrait'); isLandscape=false;
                        }
                        currentFT = ft;
                        let y = MT;

                        /* ══ HEADER PRODUCTO ══ */
                        sf('#0a0e1a'); doc.rect(ML,y,CW,20,'F');
                        sf('#059669'); doc.rect(ML,y,3,20,'F');
                        B(15,'#ffffff'); doc.text((ft.producto||'SIN PRODUCTO').toUpperCase(), ML+6, y+8);
                        B(18,'#fcd34d'); doc.text('LCC: '+(ft.lcc||'—'), ML+6, y+17);
                        B(12,'#93c5fd'); doc.text('TEM: '+(ft.tem||'—'), ML+70, y+17);
                        N(6.5,'#9ca3af');
                        doc.text('CAUSA: '+(ft.causa||'—'), PW-MR, y+5, {align:'right'});
                        doc.text('Entrega: '+(ft.entrega||'—')+'  ·  Autoclave: '+(ft.autoclave||'—'), PW-MR, y+10, {align:'right'});
                        doc.text(fecha, PW-MR, y+17, {align:'right'});
                        y+=23;

                        /* ══ TALLAS ══ */
                        const tallasOk=TALLAS_DEF_PDF.filter(t=>(ft.tallasCheck||{})[t]);
                        if(ft.tallaExtra) tallasOk.push(ft.tallaExtra);
                        sf('#064e3b'); doc.rect(ML,y,CW,12,'F');
                        B(6.5,'#6ee7b7'); doc.text('TALLAS APROBADAS', ML+3, y+4.5);
                        let tx=ML+3, ty=y+5.5;
                        tallasOk.forEach(t=>{
                            const tw=t.length*3.8+6;
                            sf('#10b981'); doc.roundedRect(tx,ty,tw,6,1.2,1.2,'F');
                            B(8,'#ffffff'); doc.text(t, tx+tw/2, ty+4.5, {align:'center'});
                            tx+=tw+2.5;
                        });
                        if(!tallasOk.length){ N(7,'#6b7280'); doc.text('—', ML+3, y+8); }
                        y+=14;

                        /* ══ PROGRAMAS ══ */
                        const progs=parseProg(ft.programas);
                        if(progs.length>0){
                            sf('#0a1628'); doc.rect(ML,y,CW,6,'F');
                            B(6.5,'#3b82f6'); doc.text('PROGRAMAS DE TRABAJO  —  UN PROGRAMA POR TALLA', ML+3, y+4.2);
                            y+=6;
                            progs.forEach((p,pi)=>{
                                y=checkPage(y,8);
                                sf(pi%2===0?'#0d1f35':'#0a1628'); doc.rect(ML,y,CW,8,'F');
                                sf('#2563eb'); doc.rect(ML,y,3,8,'F');
                                B(9,'#93c5fd'); doc.text(p.prog||'—', ML+5, y+5.5);
                                if(p.talla){ B(7,'#6ee7b7'); doc.text('→ '+p.talla, PW-MR, y+5.5, {align:'right'}); }
                                y+=8;
                            });
                            y+=3;
                        } else if(ft.programas){
                            sf('#0a1628'); doc.rect(ML,y,CW,8,'F');
                            sf('#2563eb'); doc.rect(ML,y,3,8,'F');
                            B(8,'#93c5fd'); doc.text(ft.programas.slice(0,100), ML+5, y+5.5);
                            y+=11;
                        }

                        /* ══ 1. ESTRUCTURA DE HILOS ══ */
                        y=checkPage(y,25);
                        sf('#1f2937'); doc.rect(ML,y,CW,7,'F');
                        sf('#10b981'); doc.rect(ML,y,3,7,'F');
                        B(9,'#f1f5f9'); doc.text('1. ESTRUCTURA DE HILOS', ML+5, y+5);
                        y+=7;

                        if(ft.estructura&&ft.estructura.length>0){
                            const eC=[{l:'PARTE',w:32},{l:'HILO / TÍTULO',w:44},{l:'TORSIÓN',w:16},
                                      {l:'LOTE',w:26},{l:'PROVEEDOR',w:26},{l:'TEJIDO',w:22},{l:'OBS.',w:24}];
                            sf('#2d3748'); doc.rect(ML,y,CW,5.5,'F');
                            let ex=ML;
                            eC.forEach(col=>{ B(5.5,'#9ca3af'); doc.text(col.l,ex+1.5,y+4); ex+=col.w; });
                            y+=5.5;
                            ft.estructura.forEach((row,ri)=>{
                                y=checkPage(y,7);
                                const rh=7;
                                sf(ri%2===0?'#0f172a':'#131c2e'); doc.rect(ML,y,CW,rh,'F');
                                sd('#1e293b'); doc.setLineWidth(0.1); doc.rect(ML,y,CW,rh,'D');
                                ex=ML;
                                const vals=[row.parte||'—',row.hilo||'—',row.torsion||'—',
                                            row.lote||'—',row.proveedor||'—',row.tejido||'—',row.obs||''];
                                const sty=[{c:'#10b981',b:1},{c:'#93c5fd',b:1},{c:'#fcd34d',b:0},
                                           {c:'#d1d5db',b:0},{c:'#d1d5db',b:0},{c:'#fbcfe8',b:0},{c:'#6b7280',b:0}];
                                eC.forEach((col,ci)=>{
                                    sty[ci].b?B(7.5,sty[ci].c):N(7,sty[ci].c);
                                    const txt=String(vals[ci]||'');
                                    const max=Math.floor(col.w/2.1);
                                    doc.text(txt.length>max?txt.slice(0,max-1)+'…':txt, ex+1.5, y+4.8);
                                    ex+=col.w;
                                });
                                y+=rh;
                            });
                        } else {
                            N(7,'#4b5563'); doc.text('Sin estructura definida.', ML+3, y+4.5); y+=7;
                        }
                        y+=4;

                        /* ══ FT-CIR-005 ENHEBRADO ══ */
                        const refId    = ft.fichaRefId;
                        const enhFicha = refId?(enhData[refId]||null):null;
                        const enhGrid  = enhFicha?(enhFicha.grid||{}):{};
                        const enhAlim  = enhFicha?(enhFicha.numAlim||8):8;
                        const enhGH    = enhFicha?(enhFicha.numGH||9):9;

                        /* Orange FT-005 header — always on current page */
                        y=checkPage(y,12);
                        sf('#7c2d12'); doc.rect(ML,y,CW,8,'F');
                        sf('#f97316'); doc.rect(ML,y,3,8,'F');
                        B(9,'#fed7aa'); doc.text('FT-CIR-005  ·  ESQUEMA DE ENHEBRADO — GUÍAHILOS × ALIMENTADORES', ML+5, y+5.5);
                        B(7,'#fb923c'); doc.text(enhAlim+' Alim.  ·  '+enhGH+' GH', PW-MR, y+5.5, {align:'right'});
                        y+=10;

                        if(!refId||Object.keys(enhGrid).length===0){
                            sf('#1a0a00'); doc.rect(ML,y,CW,9,'F');
                            N(7.5,'#6b7280'); doc.text('Sin enhebrado configurado. Completa la FT-CIR-005.', ML+3, y+5.5);
                            y+=12;
                        } else {
                            /* Build hilo color map */
                            const hilosEnh={};
                            Object.values(enhGrid).forEach(h=>{ if(h&&h.titulo) hilosEnh[h.titulo]={nombre:h.nombre}; });
                            const legendItems=Object.keys(hilosEnh);
                            const legendColors=['#93c5fd','#6ee7b7','#fcd34d','#f9a8d4','#c4b5fd','#fca5a5','#fdba74'];
                            const hcMap={};
                            legendItems.forEach((t,i)=>{ hcMap[t]=legendColors[i%legendColors.length]; });

                            /* Legend — compact single row */
                            sf('#1a0a00'); doc.rect(ML,y,CW,7,'F');
                            B(6.5,'#fb923c'); doc.text('HILOS EN USO:', ML+3, y+4.8);
                            let lx=ML+34;
                            legendItems.forEach((tit,li)=>{
                                const col=hcMap[tit];
                                const[lr,lg,lb]=h2r(col);
                                doc.setFillColor(lr,lg,lb); doc.roundedRect(lx,y+2,3,3,0.5,0.5,'F');
                                B(6.5,col); doc.text(tit, lx+4.5, y+4.8);
                                lx+=tit.length*2.4+12;
                            });
                            y+=8;

                            /* ── MATRIX: decide portrait vs landscape ── */
                            const ghArr=[]; for(let i=1;i<=enhGH;i++) ghArr.push(i);
                            const alimArr=[]; for(let i=1;i<=enhAlim;i++) alimArr.push(i);

                            const alimLW=22;
                            /* Can it fit in portrait? Min cell width = 18mm */
                            const cellWPortrait = (CW - alimLW) / enhGH;
                            const usePortrait   = cellWPortrait >= 18;

                            if(usePortrait){
                                /* Portrait matrix — stays on current page if fits */
                                const matH = 8 + enhAlim*9;
                                y=checkPage(y, matH);
                                const ghW=cellWPortrait;
                                const rowH=9, hdrH=8;

                                /* GH header */
                                sf('#7c2d12'); doc.rect(ML,y,alimLW,hdrH,'F');
                                B(6.5,'#fed7aa'); doc.text('ALIM.↓ / GH→', ML+1, y+5.5);
                                ghArr.forEach((g,gi)=>{
                                    const gx=ML+alimLW+gi*ghW;
                                    sf(gi%2===0?'#450a0a':'#5c1a0a'); doc.rect(gx,y,ghW,hdrH,'F');
                                    sd('#7c2d12'); doc.setLineWidth(0.15); doc.rect(gx,y,ghW,hdrH,'D');
                                    B(7.5,'#fca5a5'); doc.text('GH#'+g, gx+ghW/2, y+5.5, {align:'center'});
                                });
                                y+=hdrH;

                                alimArr.forEach((a,ai)=>{
                                    sf(ai%2===0?'#1a0500':'#220800'); doc.rect(ML,y,alimLW,rowH,'F');
                                    B(8,'#fb923c'); doc.text('A#'+a, ML+2, y+rowH/2+1.5);
                                    ghArr.forEach((g,gi)=>{
                                        const gx=ML+alimLW+gi*ghW;
                                        const hilo=enhGrid['a'+a+'_g'+g];
                                        if(hilo&&hilo.titulo){
                                            const col=hcMap[hilo.titulo]||'#e2e8f0';
                                            const[hr,hg2,hb]=h2r(col);
                                            doc.setFillColor(Math.floor(hr*.15),Math.floor(hg2*.15),Math.floor(hb*.15));
                                            doc.rect(gx,y,ghW,rowH,'F');
                                            doc.setFillColor(hr,hg2,hb);
                                            doc.roundedRect(gx+1,y+1,ghW-2,rowH-2,1.2,1.2,'F');
                                            const hasT=!!hilo.torsion;
                                            const badgeW=hasT?Math.min(7.5,ghW*0.3):0;
                                            const textW=ghW-badgeW;
                                            const textCx=gx+textW/2;
                                            B(7,'#0a0e1a');
                                            const t=hilo.titulo; const max=Math.floor(textW/2.1);
                                            if(t.length<=max){
                                                centerText(t, textCx, y+rowH/2);
                                            } else {
                                                const sp=t.indexOf(' ',Math.floor(t.length/2)-2);
                                                const l1=sp>0?t.slice(0,sp):t.slice(0,max);
                                                const l2=sp>0?t.slice(sp+1):t.slice(max);
                                                doc.setFontSize(6);
                                                centerText(l1, textCx, y+rowH/2-1.6);
                                                centerText(l2.slice(0,max), textCx, y+rowH/2+1.8);
                                            }
                                            if(hasT) drawTorsionBadge(gx+ghW-1-badgeW, y+1, badgeW, rowH-2, hilo.torsion);
                                        } else {
                                            sf(ai%2===0?'#110300':'#180500'); doc.rect(gx,y,ghW,rowH,'F');
                                            sd('#2a0800'); doc.setLineWidth(0.1); doc.rect(gx,y,ghW,rowH,'D');
                                            N(8,'#2a1200'); centerText('—', gx+ghW/2, y+rowH/2);
                                        }
                                    });
                                    y+=rowH;
                                });
                                y+=5;

                            } else {
                                /* Landscape matrix page */
                                footerLine(doc.getNumberOfPages(),'?');
                                doc.addPage('a4','landscape'); isLandscape=true;
                                let ly=LMT;

                                /* Landscape header */
                                sf('#0d1520'); doc.rect(LML,ly,LCW,9,'F');
                                B(10,'#10b981'); doc.text((ft.produto||ft.producto||'').toUpperCase(), LML+3, ly+6);
                                B(8,'#fcd34d'); doc.text('LCC: '+(ft.lcc||'—'), LML+110, ly+6);
                                B(7,'#fb923c'); doc.text('FT-CIR-005 · ENHEBRADO', LW-LMR, ly+3.5, {align:'right'});
                                N(6,'#6b7280'); doc.text(fecha, LW-LMR, ly+8, {align:'right'});
                                ly+=11;

                                /* Legend landscape */
                                sf('#1a0a00'); doc.rect(LML,ly,LCW,7,'F');
                                B(6.5,'#fb923c'); doc.text('HILOS EN USO:', LML+3, ly+4.8);
                                let lx2=LML+34;
                                legendItems.forEach((tit,li)=>{
                                    const col=hcMap[tit];
                                    const[lr,lg,lb]=h2r(col);
                                    doc.setFillColor(lr,lg,lb); doc.roundedRect(lx2,ly+2,3,3,0.5,0.5,'F');
                                    B(7,col); doc.text(tit, lx2+4.5, ly+4.8);
                                    lx2+=tit.length*2.6+14;
                                });
                                ly+=9;

                                const ghW2=Math.max(24,Math.min(40,(LCW-alimLW)/enhGH));
                                const rowH2=11, hdrH2=9;

                                sf('#7c2d12'); doc.rect(LML,ly,alimLW,hdrH2,'F');
                                B(7,'#fed7aa'); doc.text('ALIM.↓ / GH→', LML+1.5, ly+6);
                                ghArr.forEach((g,gi)=>{
                                    const gx=LML+alimLW+gi*ghW2;
                                    sf(gi%2===0?'#450a0a':'#5c1a0a'); doc.rect(gx,ly,ghW2,hdrH2,'F');
                                    sd('#7c2d12'); doc.setLineWidth(0.15); doc.rect(gx,ly,ghW2,hdrH2,'D');
                                    B(8.5,'#fca5a5'); doc.text('GH #'+g, gx+ghW2/2, ly+6, {align:'center'});
                                });
                                ly+=hdrH2;

                                alimArr.forEach((a,ai)=>{
                                    sf(ai%2===0?'#1a0500':'#220800'); doc.rect(LML,ly,alimLW,rowH2,'F');
                                    B(9,'#fb923c'); doc.text('ALIM #'+a, LML+2, ly+rowH2/2+1.8);
                                    ghArr.forEach((g,gi)=>{
                                        const gx=LML+alimLW+gi*ghW2;
                                        const hilo=enhGrid['a'+a+'_g'+g];
                                        if(hilo&&hilo.titulo){
                                            const col=hcMap[hilo.titulo]||'#e2e8f0';
                                            const[hr,hg2,hb]=h2r(col);
                                            doc.setFillColor(Math.floor(hr*.15),Math.floor(hg2*.15),Math.floor(hb*.15));
                                            doc.rect(gx,ly,ghW2,rowH2,'F');
                                            doc.setFillColor(hr,hg2,hb);
                                            doc.roundedRect(gx+1.5,ly+1.5,ghW2-3,rowH2-3,1.5,1.5,'F');
                                            const hasT=!!hilo.torsion;
                                            const badgeW2=hasT?Math.min(9,ghW2*0.3):0;
                                            const textW2=ghW2-badgeW2;
                                            const textCx2=gx+textW2/2;
                                            B(8,'#0a0e1a');
                                            const t=hilo.titulo; const max=Math.floor(textW2/2.2);
                                            if(t.length<=max){
                                                centerText(t, textCx2, ly+rowH2/2);
                                            } else {
                                                const sp=t.indexOf(' ',Math.floor(t.length/2)-2);
                                                const l1=sp>0?t.slice(0,sp):t.slice(0,max);
                                                const l2=sp>0?t.slice(sp+1):t.slice(max);
                                                doc.setFontSize(7);
                                                centerText(l1, textCx2, ly+rowH2/2-1.9);
                                                centerText(l2.slice(0,max), textCx2, ly+rowH2/2+2.1);
                                            }
                                            if(hasT) drawTorsionBadge(gx+ghW2-1.5-badgeW2, ly+1.5, badgeW2, rowH2-3, hilo.torsion);
                                        } else {
                                            sf(ai%2===0?'#110300':'#180500'); doc.rect(gx,ly,ghW2,rowH2,'F');
                                            sd('#2a0800'); doc.setLineWidth(0.1); doc.rect(gx,ly,ghW2,rowH2,'D');
                                            N(8,'#2a1200'); centerText('—', gx+ghW2/2, ly+rowH2/2);
                                        }
                                    });
                                    ly+=rowH2;
                                });
                                footerLine(doc.getNumberOfPages(),'?');

                                /* Back to portrait */
                                doc.addPage('a4','portrait'); isLandscape=false;
                                y=MT;
                                /* mini-header */
                                sf('#0d1520'); doc.rect(ML,y,CW,8,'F');
                                B(9,'#10b981'); doc.text((ft.producto||'').toUpperCase(), ML+3, y+5.5);
                                B(7,'#fcd34d'); doc.text('LCC: '+(ft.lcc||'—'), ML+100, y+5.5);
                                N(5.5,'#6b7280'); doc.text('Medidas · Aprobaciones', PW-MR, y+5.5, {align:'right'});
                                y+=11;
                            }
                        }

                        /* ══ 2. MEDIDAS EN REPOSO ══ */
                        if(ft.medidasReposo&&Object.keys(ft.medidasReposo).length>0){
                            y=checkPage(y,20);
                            sf('#1e3a5f'); doc.rect(ML,y,CW,7,'F');
                            sf('#3b82f6'); doc.rect(ML,y,3,7,'F');
                            B(9,'#bfdbfe'); doc.text('2. MEDIDAS EN REPOSO', ML+5, y+5);
                            y+=7;
                            const rP=['Puño','Cuerpo/Panty','Pierna','Largo Total'];
                            const rCW=(CW-32)/(rP.length);
                            sf('#0f2744'); doc.rect(ML,y,CW,5.5,'F');
                            B(5.5,'#9ca3af'); doc.text('TALLA',ML+2,y+4); doc.text('DIÁM.',ML+18,y+4);
                            rP.forEach((p,pi2)=>{ B(6,pi2%2===0?'#93c5fd':'#bfdbfe'); doc.text(p,ML+32+pi2*rCW+rCW/2,y+4,{align:'center'}); });
                            y+=5.5;
                            /* sub-header MIN/PROM/MAX */
                            sf('#0a1628'); doc.rect(ML,y,CW,4.5,'F');
                            rP.forEach((p,pi2)=>{
                                ['MIN','PROM','MAX'].forEach((l,li)=>{
                                    st(l!=='PROM'?'#ef4444':'#4b5563');
                                    doc.setFont('helvetica','bold'); doc.setFontSize(5);
                                    doc.text(l,ML+32+pi2*rCW+(li*(rCW/3))+rCW/6,y+3.2,{align:'center'});
                                });
                            });
                            y+=4.5;
                            Object.keys(ft.medidasReposo).forEach((talla,ti)=>{
                                y=checkPage(y,8);
                                const mr=ft.medidasReposo[talla]||{};
                                sf(ti%2===0?'#0a0e1a':'#0d1520'); doc.rect(ML,y,CW,8,'F');
                                B(9,'#f1f5f9'); doc.text(talla,ML+2,y+5.5);
                                B(7.5,'#3b82f6'); doc.text(mr['__diam__']||'—',ML+18,y+5.5);
                                rP.forEach((parte,pi2)=>{
                                    const pd=mr[parte]||{};
                                    ['min','prom','max'].forEach((l,li)=>{
                                        const v=pd[l]||'';
                                        const cx=ML+32+pi2*rCW+(li*(rCW/3))+rCW/6;
                                        if(l!=='prom') B(7.5,'#ef4444'); else N(7.5,'#e2e8f0');
                                        const max=Math.floor((rCW/3)/2.1);
                                        doc.text(v.length>max?v.slice(0,max-1)+'…':v, cx, y+5.5, {align:'center'});
                                    });
                                });
                                y+=8;
                            });
                            y+=4;
                        }

                        /* ══ 3. MEDIDAS EN CRUDO ══ */
                        if(ft.medidasCrudo&&Object.keys(ft.medidasCrudo).length>0){
                            y=checkPage(y,20);
                            sf('#14532d'); doc.rect(ML,y,CW,7,'F');
                            sf('#16a34a'); doc.rect(ML,y,3,7,'F');
                            B(9,'#86efac'); doc.text('3. MEDIDAS EN CRUDO', ML+5, y+5);
                            y+=7;
                            const aC=(ft.anchosActivos||[]).concat(ft.anchoExtra?[ft.anchoExtra]:[]);
                            const lC=(ft.largosActivos||[]).concat(ft.largoExtra?[ft.largoExtra]:[]);
                            const allC=[].concat(aC,lC);
                            if(allC.length>0){
                                const lblW=36;
                                /* Give each col enough width for notes — min 28mm */
                                const colW=Math.max(28,(CW-lblW)/allC.length);
                                /* Group headers */
                                sf('#1e3a5f'); doc.rect(ML+lblW,y,aC.length*colW,5.5,'F');
                                sf('#064e3b'); doc.rect(ML+lblW+aC.length*colW,y,lC.length*colW,5.5,'F');
                                B(7,'#93c5fd'); doc.text('ANCHOS (cm)',ML+lblW+aC.length*colW/2,y+3.8,{align:'center'});
                                B(7,'#6ee7b7'); doc.text('LARGOS (cm)',ML+lblW+aC.length*colW+lC.length*colW/2,y+3.8,{align:'center'});
                                y+=5.5;
                                /* Col name headers */
                                sf('#1f2937'); doc.rect(ML,y,CW,6.5,'F');
                                B(6,'#9ca3af');
                                doc.text('TALLA',ML+2,y+4.5); doc.text('LÍM.',ML+16,y+4.5); doc.text('DIÁM.',ML+26,y+4.5);
                                allC.forEach((col,ci)=>{
                                    B(6.5,ci<aC.length?'#93c5fd':'#6ee7b7');
                                    const t=col.length>12?col.slice(0,11)+'…':col;
                                    doc.text(t,ML+lblW+ci*colW+colW/2,y+4.5,{align:'center'});
                                });
                                y+=6.5;
                                tallasOk.filter(t=>ft.medidasCrudo[t]).forEach(talla=>{
                                    y=checkPage(y,20);
                                    const mc=ft.medidasCrudo[talla]||{};
                                    const diam=mc['__diam__']||'';
                                    const rowH=8;
                                    ['min','prom','max'].forEach((lim,li)=>{
                                        const isE=lim!=='prom';
                                        sf(isE?'#1a0a0a':'#111827'); doc.rect(ML,y,CW,rowH,'F');
                                        if(li===0){ B(9,'#f1f5f9'); doc.text(talla,ML+2,y+5.5); B(7,'#3b82f6'); doc.text(diam,ML+26,y+5.5); }
                                        if(isE) B(7,'#ef4444'); else B(7,'#9ca3af');
                                        doc.text(lim.toUpperCase(),ML+16,y+5.5);
                                        allC.forEach((col,ci)=>{
                                            const v=String(((mc[lim]||{})[col])||'');
                                            /* Wide cell — show full note text */
                                            const max=Math.floor(colW/2.05);
                                            if(isE) B(7.5,'#ef4444'); else N(7.5,'#e2e8f0');
                                            const disp=v.length>max?v.slice(0,max-1)+'…':v;
                                            doc.text(disp,ML+lblW+ci*colW+colW/2,y+5.5,{align:'center'});
                                        });
                                        y+=rowH;
                                    });
                                    sd('#14532d'); doc.setLineWidth(0.4); doc.line(ML,y,ML+CW,y); doc.setLineWidth(0.1);
                                    y+=1;
                                });
                                y+=4;
                            }
                        }

                        /* ══ APROBACIONES ══ */
                        y=checkPage(y,38);
                        sf('#4c1d95'); doc.rect(ML,y,CW,7,'F');
                        sf('#7c3aed'); doc.rect(ML,y,3,7,'F');
                        B(9,'#ede9fe'); doc.text('APROBACIÓN Y LIBERACIÓN A PRODUCCIÓN', ML+5, y+5);
                        y+=9;
                        const aprobDefs=[
                            {k:'aproboArmado',    l:'ARMADO Y CALIDAD', col:'#3b82f6'},
                            {k:'aproboCorseteria',l:'CORSETERÍA',        col:'#10b981'},
                            {k:'aproboCalidad',   l:'CALIDAD',           col:'#f59e0b'},
                            {k:'aproboDiseno',    l:'DISEÑO',            col:'#ec4899'},
                        ];
                        const bw=(CW-9)/4;
                        aprobDefs.forEach((item,ai)=>{
                            const apr=ft[item.k]||{};
                            const bx=ML+ai*(bw+3);
                            const[cr,cg,cb]=h2r(item.col);
                            sf('#0d1520'); doc.roundedRect(bx,y,bw,26,2,2,'F');
                            doc.setDrawColor(cr,cg,cb); doc.setLineWidth(1.2);
                            doc.roundedRect(bx,y,bw,26,2,2,'D'); doc.setLineWidth(0.2);
                            B(6.5,item.col); doc.text(item.l,bx+bw/2,y+5,{align:'center'});
                            if(apr.bloqueado){
                                doc.setFillColor(cr,cg,cb); doc.roundedRect(bx+2,y+7,bw-4,9,1.5,1.5,'F');
                                B(7.5,'#ffffff'); doc.text('✓ '+apr.nombre,bx+bw/2,y+12,{align:'center'});
                                N(5.5,'#ffffffcc'); doc.text(apr.fecha||'',bx+bw/2,y+18,{align:'center'});
                            } else {
                                sd('#374151'); doc.setLineWidth(0.35); doc.line(bx+4,y+19,bx+bw-4,y+19); doc.setLineWidth(0.1);
                                N(6,'#6b7280'); doc.text('PENDIENTE',bx+bw/2,y+23.5,{align:'center'});
                            }
                        });
                        y+=30;
                        const allAppr=aprobDefs.every(item=>(ft[item.k]||{}).bloqueado);
                        if(allAppr){
                            sf('#065f46'); doc.rect(ML,y,CW,8,'F');
                            B(10,'#6ee7b7'); doc.text('✓  PRODUCTO LIBERADO A PRODUCCIÓN',ML+CW/2,y+5.5,{align:'center'});
                            y+=11;
                        }
                        if(ft.fechaAprobacion||ft.observacionesGenerales){
                            sf('#0d1520'); doc.rect(ML,y,CW,ft.observacionesGenerales?18:7,'F');
                            B(7,'#9ca3af'); doc.text('Fecha Aprobación:',ML+3,y+5);
                            N(7,'#f1f5f9'); doc.text(ft.fechaAprobacion||'—',ML+38,y+5);
                            if(ft.observacionesGenerales){
                                B(7,'#9ca3af'); doc.text('Obs:',ML+3,y+11);
                                N(7,'#e2e8f0');
                                const obs=doc.splitTextToSize(ft.observacionesGenerales,CW-20);
                                doc.text(obs.slice(0,2),ML+16,y+11);
                            }
                            y+=ft.observacionesGenerales?21:10;
                        }
                        footerLine(doc.getNumberOfPages(),'?');
                    });

                    /* Fix page numbers */
                    const total=doc.getNumberOfPages();
                    for(let p=1;p<=total;p++){
                        doc.setPage(p);
                        /* re-write total in footer — overwrite '?' with actual total */
                        const pgW=doc.internal.pageSize.getWidth();
                        const pgH=doc.internal.pageSize.getHeight();
                        sf('#0a0e1a'); doc.rect(pgW-25,pgH-9,25,6,'F');
                        N(5.5,'#4b5563');
                        doc.text(fecha+'  ·  Pág '+p+'/'+total, pgW-(pgW===297?LMR:MR), pgH-5.5, {align:'right'});
                    }

                    const fname='Swantex_Guia_Operarios_'+new Date().toLocaleDateString('es-CO').replace(/\//g,'-')+'.pdf';
                    doc.save(fname);
                } catch(err) {
                    console.error(err);
                    alert('Error PDF Operarios: '+err.message);
                } finally { setIsExporting(false); }
            }, 50);
        };


        /* ══════════════════════════════════════
           ENHEBRADO TAB — FT-CIR-004
        ══════════════════════════════════════ */

        // Colores por tipo de hilo (para las pastillas)
        const HILO_COLORS = {
            'Nylon Tex':  { bg:'#1e3a5f', border:'#3b82f6', text:'#93c5fd', dot:'#3b82f6' },
            'Nylon Rig':  { bg:'#2e1a5f', border:'#8b5cf6', text:'#c4b5fd', dot:'#8b5cf6' },
            'Lycra':      { bg:'#064e3b', border:'#10b981', text:'#6ee7b7', dot:'#10b981' },
            'Poliester':  { bg:'#451a03', border:'#f59e0b', text:'#fcd34d', dot:'#f59e0b' },
            'Jaspe':      { bg:'#450a0a', border:'#ef4444', text:'#fca5a5', dot:'#ef4444' },
        };
        const getHiloColor = (nombre) => HILO_COLORS[nombre] || { bg:'#1f2937', border:'#374151', text:'#9ca3af', dot:'#6b7280' };

                /* ══════════════════════════════════════
           RENDER PRINCIPAL (con pestañas)
        ══════════════════════════════════════ */
        return (
            <div style={{minHeight:'100vh', padding:'20px 16px 60px', maxWidth:1400, margin:'0 auto'}}>
                {/* ── HEADER ── */}
                <header style={{marginBottom:20, display:'flex', flexWrap:'wrap', gap:16, alignItems:'center', justifyContent:'space-between'}}>
                    <div>
                        <div style={{display:'flex', alignItems:'baseline', gap:10}}>
                            <h1 style={{fontSize:26, fontWeight:900, letterSpacing:'-0.04em', margin:0, color:'#f1f5f9'}}>
                                TEXTILES <span style={{color:'#10b981'}}>SWANTEX</span>
                            </h1>
                            <span style={{fontSize:10, fontWeight:800, color:'#4b5563', textTransform:'uppercase', letterSpacing:'0.1em'}}>SAS</span>
                        </div>
                        <p style={{margin:'2px 0 0', fontSize:10, fontWeight:700, color:'#374151', textTransform:'uppercase', letterSpacing:'0.12em', display:'flex', alignItems:'center', gap:8}}>
                            Sistema de Ingeniería Textil · v7
                            {cloudSyncStatus==='syncing' && <span style={{color:'#93c5fd', textTransform:'none', letterSpacing:0}}>· ⏳ sincronizando con SWAN2...</span>}
                            {cloudSyncStatus==='synced'  && <span style={{color:'#34d399', textTransform:'none', letterSpacing:0}}>· ☁ sincronizado con SWAN2</span>}
                        </p>
                    </div>
                    <div style={{display:'flex', flexWrap:'wrap', gap:8}}>
                        <button className="btn btn-dark" onClick={() => fileInputRef.current.click()}><Ico.Upload/> Importar</button>
                        <input type="file" ref={fileInputRef} onChange={importBackup} style={{display:'none'}} accept=".json"/>
                        <button className="btn btn-dark" onClick={exportBackup}><Ico.Save/> Backup</button>
                        <button className="btn btn-dark" onClick={exportExcel}><Ico.Excel/> Excel</button>
                        <button className="btn btn-blue" onClick={downloadPdf} disabled={isExporting}
                            title="PDF de Precosteos — para Ingeniería"
                            style={{display: activeTab==='precosteos' ? 'inline-flex' : 'none'}}>
                            <Ico.Pdf/> {isExporting ? 'Generando…' : 'PDF Precosteos'}
                        </button>
                        <button
                            onClick={downloadPdfOperarios} disabled={isExporting}
                            title="PDF Ficha Técnica completa — para Operarios en planta"
                            style={{
                                display: activeTab==='ftcir004' ? 'inline-flex' : 'none',
                                padding:'9px 16px', borderRadius:10, fontWeight:700,
                                fontSize:12, cursor:'pointer', border:'none',
                                alignItems:'center', gap:6,
                                background:'#7c3aed', color:'#fff',
                                textTransform:'uppercase', letterSpacing:'0.04em',
                                whiteSpace:'nowrap'
                            }}>
                            <Ico.Pdf/> {isExporting ? 'Generando…' : 'PDF Operarios'}
                        </button>
                        {activeTab === 'precosteos' && (
                            <button className="btn btn-emerald" onClick={createNew}><Ico.Plus/> Nueva Ficha</button>
                        )}
                    </div>
                </header>

                {/* ── PESTAÑAS ── */}
                <div style={{display:'flex', gap:4, marginBottom:24, borderBottom:'2px solid #1f2937', paddingBottom:0}}>
                    {[
                        { id:'precosteos', label:'F-CIR-002', sub:'Precosteos' },
                        { id:'ftcir004',   label:'FT-CIR-004', sub:'Medidas' },
                        { id:'enhebrado',  label:'FT-CIR-005', sub:'Enhebrado' },
                    ].map(tab => (
                        <button key={tab.id} onClick={()=>setActiveTab(tab.id)}
                            style={{
                                padding:'10px 22px 12px', border:'none', cursor:'pointer', borderRadius:'10px 10px 0 0',
                                background: activeTab===tab.id ? '#111827' : 'transparent',
                                borderBottom: activeTab===tab.id ? '2px solid #10b981' : '2px solid transparent',
                                marginBottom:-2, transition:'all 0.15s',
                                display:'flex', flexDirection:'column', alignItems:'center', gap:1,
                            }}>
                            <span style={{fontSize:10, fontWeight:900, color: activeTab===tab.id ? '#10b981' : '#4b5563',
                                textTransform:'uppercase', letterSpacing:'0.1em'}}>{tab.label}</span>
                            <span style={{fontSize:12, fontWeight:700, color: activeTab===tab.id ? '#f1f5f9' : '#6b7280'}}>{tab.sub}</span>
                        </button>
                    ))}
                </div>

                {/* ── CONTENIDO PESTAÑAS ── */}
                {activeTab === 'precosteos' && (
                    <div>
                        {/* Dashboard */}
                        <section style={{display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))', gap:12, marginBottom:24}}>
                            {[
                                { label:'Costo Consolidado', val:`$${globalSummary.totalCost.toFixed(2)}`, sub:'USD / Docena', color:'#10b981' },
                                { label:'Consumo MP Total',  val:`${globalSummary.totalKg.toFixed(3)}`,   sub:'Kilogramos',   color:'#3b82f6' },
                                { label:'Referencias',       val:globalSummary.count,                     sub:'Fichas activas', color:'#8b5cf6' },
                                { label:'Aprobadas',         val:structures.filter(s=>s.status==='APROBADO').length, sub:'En producción', color:'#f59e0b' },
                            ].map((c,i) => (
                                <div key={i} className="stat-card">
                                    <p style={{fontSize:10, fontWeight:800, color:c.color, textTransform:'uppercase', letterSpacing:'0.1em', margin:'0 0 8px'}}>{c.label}</p>
                                    <p className="mono" style={{fontSize:26, fontWeight:700, margin:'0 0 2px', color:'#f1f5f9'}}>{c.val}</p>
                                    <p style={{fontSize:10, color:'#4b5563', margin:0, textTransform:'uppercase', fontWeight:600}}>{c.sub}</p>
                                </div>
                            ))}
                        </section>

                        {/* Filtros */}
                        <div style={{display:'flex', gap:10, marginBottom:20, flexWrap:'wrap', alignItems:'center'}}>
                            <input value={searchQuery} onChange={e=>setSearchQuery(e.target.value)}
                                placeholder="Buscar por prenda, referencia, fibra…"
                                style={{maxWidth:280, background:'#0d1520', border:'1px solid #2a3a50', color:'#e2e8f0'}}/>
                            {['TODOS','PENDIENTE','REVISIÓN','APROBADO'].map(st => (
                                <button key={st} onClick={()=>setFilterStatus(st)}
                                    style={{padding:'6px 14px', borderRadius:8, fontSize:11, fontWeight:700, cursor:'pointer',
                                        background: filterStatus===st?'#10b981':'#1f2937',
                                        color: filterStatus===st?'#fff':'#6b7280',
                                        border: filterStatus===st?'1px solid #059669':'1px solid #374151',
                                        textTransform:'uppercase', letterSpacing:'0.06em'}}>{st}</button>
                            ))}
                            <span style={{fontSize:11, color:'#4b5563', marginLeft:'auto'}}>
                                {visibleStructures.length} de {structures.length} fichas
                            </span>
                        </div>

                        {/* Lista fichas */}
                        <div ref={printRef} style={{display:'flex', flexDirection:'column', gap:24}}>
                            {visibleStructures.length === 0 && (
                                <div style={{textAlign:'center', padding:'60px 20px', background:'#111827',
                                    borderRadius:20, border:'2px dashed #1f2937'}}>
                                    <p style={{color:'#374151', fontWeight:700, fontSize:16, textTransform:'uppercase'}}>
                                        {searchQuery||filterStatus!=='TODOS' ? 'Sin resultados' : 'No hay fichas técnicas'}
                                    </p>
                                    {!searchQuery && filterStatus==='TODOS' && (
                                        <button className="btn btn-emerald" style={{marginTop:16}} onClick={createNew}>
                                            <Ico.Plus/> Crear primera ficha
                                        </button>
                                    )}
                                </div>
                            )}
                            {visibleStructures.map((s, idx) => (
                                <FichaCard key={s.id} s={s} idx={idx}
                                    isExpanded={expandedId===s.id || visibleStructures.length===1}
                                    onToggle={()=>setExpandedId(prev=>prev===s.id?null:s.id)}
                                    onUpdate={updateField} onMachineChange={handleMachineChange}
                                    onAddMaquina={addMaquinaOpcion} onRemoveMaquina={removeMaquinaOpcion}
                                    onFibraUpdate={updateFibra} onFibraRemove={removeFibra}
                                    onDelete={deleteStructure}
                                    onDuplicate={duplicateStructure}
                                    realIdx={structures.findIndex(x=>x.id===s.id)}
                                />
                            ))}
                        </div>
                    </div>
                )}

                {/* Se mantienen SIEMPRE montados (display:none en vez de desmontar) para que
                    no pierdan su ficha seleccionada al cambiar de pestaña y volver. */}
                <div style={{display: activeTab === 'ftcir004' ? 'block' : 'none'}}>
                    <FT004Tab structures={structures} />
                </div>

                <div style={{display: activeTab === 'enhebrado' ? 'block' : 'none'}}>
                    <EnhebradoTab structures={structures} />
                </div>
            </div>
        );
    };

    /* ══════════════════════════════════════════
       COMPONENTE FICHA CARD
    ══════════════════════════════════════════ */
    const FichaCard = ({ s, idx, realIdx, isExpanded, onToggle, onUpdate, onMachineChange, onAddMaquina, onRemoveMaquina, onFibraUpdate, onFibraRemove, onDelete, onDuplicate }) => {
        const tubos = parseInt(s.header.tubosPorDocena)||12;
        const dW = (parseFloat(s.specs.pesoUnitarioGramos)||0) * tubos;
        const totalPct = s.fibras.reduce((a,f)=>a+(f.porcentaje||0), 0);
        const totalCost = s.fibras.reduce((acc,f) => {
            const gr = dW*(f.porcentaje/100);
            return acc + (gr/1000)*(parseFloat(f.costoKg)||0);
        }, 0);

        // ── Estado del asistente de composición ─────────────────────
        const [respAsistente, setRespAsistente] = useState({});
        const [asistenteListo, setAsistenteListo] = useState(false);

        const tieneSpandex   = s.fibras.some(f=>esSpandexDesnudo(f.nombre,f.titulo));
        const tieneBodyFresh = s.fibras.some(f=>esBodyFresh(f));
        const necesita       = necesitaAsistente(s.fibras);
        // Si no necesita asistente, siempre listo
        const puedeCalcular  = !necesita || asistenteListo;

        const respFinal = {
            spandexPct:   (respAsistente.spandexPct != null ? respAsistente.spandexPct : (tieneSpandex ? 1 : 0)),
            bodyFreshPct: (respAsistente.bodyFreshPct != null ? respAsistente.bodyFreshPct : (tieneBodyFresh ? 5 : 0)),
        };

        // Recalcular cuando cambian fibras o respuestas
        const composicionSugerida = useMemo(()=>
            calcularComposicionSugerida(s.fibras, s.header.alimentadores||8, puedeCalcular ? respFinal : undefined),
            [s.id, s.updatedAt, s.header.alimentadores, puedeCalcular, JSON.stringify(respAsistente)]
        );
        const getSugerido = (fi) => { const s2=composicionSugerida.find(x=>x.idx===fi); return s2?s2.porcentaje:null; };

        const aplicarTodas = () => {
            composicionSugerida.forEach(sg=>{
                if(sg.porcentaje>0) onFibraUpdate(s.id, sg.idx, 'porcentaje', sg.porcentaje);
            });
        };

        // Texto etiqueta ICONTEC
        const textoEtiqueta = (() => {
            const items = s.fibras
                .filter(f=>f.porcentaje>0 && f.titulo)
                .sort((a,b)=>b.porcentaje-a.porcentaje)
                .map(f=>`${f.porcentaje}% ${NOMBRE_ETIQUETA[f.nombre]||f.nombre}`);
            return items.join(' / ');
        })();

        const cycleSeconds = (parseInt(s.specs.tiempoMin)||0)*60 + (parseInt(s.specs.tiempoSeg)||0);
        const docsPerDay = cycleSeconds > 0 ? Math.floor(86400/cycleSeconds/tubos) : 0;

        const statusColors = { 'PENDIENTE':'#f59e0b', 'REVISIÓN':'#3b82f6', 'APROBADO':'#10b981' };
        const sColor = statusColors[s.status] || '#6b7280';

        return (
            <div className="card card-hover fade-in" style={{border:`1px solid #1f2937`}}>
                {/* ── Cabecera Ficha ── */}
                <div style={{
                    background:'linear-gradient(135deg, #0d1520 0%, #111827 100%)',
                    padding:'20px 24px', display:'flex', flexWrap:'wrap', gap:16,
                    alignItems:'center', justifyContent:'space-between',
                    borderBottom:'1px solid #1f2937'
                }}>
                    <div style={{flex:1, minWidth:220}}>
                        <div style={{display:'flex', alignItems:'center', gap:10, marginBottom:8}}>
                            <span style={{
                                background:'#10b981', color:'#fff', width:28, height:28,
                                borderRadius:8, display:'flex', alignItems:'center', justifyContent:'center',
                                fontSize:11, fontWeight:900
                            }}>#{realIdx+1}</span>
                            <span style={{fontSize:10, color:'#4b5563', fontWeight:800, textTransform:'uppercase', letterSpacing:'0.12em'}}>
                                {s.id}
                            </span>
                            <span style={{
                                padding:'3px 10px', borderRadius:99, fontSize:10, fontWeight:800,
                                textTransform:'uppercase', letterSpacing:'0.08em',
                                background: sColor+'20', color: sColor, border:`1px solid ${sColor}40`
                            }}>{s.status}</span>
                        </div>
                        <input
                            value={s.nombrePrenda}
                            onChange={e => onUpdate(s.id,'nombrePrenda',e.target.value)}
                            style={{
                                background:'transparent', border:'none', color:'#f1f5f9',
                                fontSize:22, fontWeight:900, letterSpacing:'-0.03em',
                                padding:0, width:'100%', textTransform:'uppercase'
                            }}
                        />
                    </div>
                    <div style={{display:'flex', gap:10, alignItems:'center'}} className="no-print">
                        <select value={s.status} onChange={e=>onUpdate(s.id,'status',e.target.value)}
                            style={{background:'#1f2937', border:'1px solid #374151', color:'#e2e8f0',
                                borderRadius:8, padding:'7px 12px', fontSize:11, fontWeight:700,
                                textTransform:'uppercase', cursor:'pointer'}}>
                            <option value="PENDIENTE">Pendiente</option>
                            <option value="REVISIÓN">Revisión</option>
                            <option value="APROBADO">Aprobado</option>
                        </select>
                        <button className="btn btn-dark" onClick={onToggle} style={{padding:'8px 14px'}}>
                            {isExpanded ? '▲ Cerrar' : '▼ Expandir'}
                        </button>
                        <button className="btn btn-dark" style={{padding:'8px 10px',border:'1px dashed #374151',color:'#9ca3af'}} onClick={()=>onDuplicate(s)}
                            title="Duplicar ficha">⧉</button>
                        <button className="btn btn-red" style={{padding:'8px 10px'}} onClick={()=>onDelete(s.id)}
                            title="Eliminar ficha"><Ico.Trash/></button>
                    </div>
                    {/* Mini resumen siempre visible */}
                    <div style={{
                        width:'100%', display:'flex', gap:20, paddingTop:12,
                        borderTop:'1px solid #1f2937', flexWrap:'wrap'
                    }}>
                        {[
                            { label:'Referencia', val:s.header.referencia||'—' },
                            { label:'Talla', val:s.header.talla },
                            { label:'Máquina', val: getMaquinas(s.header).map(m=>maquinaLabel(m, s.header)).join(' · ') },
                            { label:'Peso Unit.', val:`${s.specs.pesoUnitarioGramos||0}g` },
                            { label:'Costo/Doc', val:`$${totalCost.toFixed(2)}`, color:'#10b981' },
                            { label:'Mezcla', val:`${totalPct}%`, color: totalPct===100?'#10b981':'#ef4444' },
                        ].map((item,i) => (
                            <div key={i}>
                                <p style={{fontSize:9, color:'#4b5563', fontWeight:700, textTransform:'uppercase', margin:'0 0 2px'}}>{item.label}</p>
                                <p className="mono" style={{fontSize:13, fontWeight:700, margin:0, color:item.color||'#d1d5db'}}>{item.val}</p>
                            </div>
                        ))}
                    </div>
                </div>

                {/* ── CUERPO EXPANDIDO ── */}
                {isExpanded && (
                    <div style={{padding:'24px'}}>
                        <div style={{display:'grid', gridTemplateColumns:'280px 1fr', gap:24, alignItems:'start'}}>

                            {/* Columna izquierda: Parámetros */}
                            <div style={{display:'flex', flexDirection:'column', gap:16}}>
                                <h3 style={{margin:0, fontSize:10, fontWeight:800, color:'#4b5563', textTransform:'uppercase', letterSpacing:'0.12em', display:'flex', alignItems:'center', gap:6}}>
                                    <Ico.Gear/> Parámetros técnicos
                                </h3>
                                <div>
                                    <label className="field-label">Referencia / Programa</label>
                                    <input value={s.header.referencia} onChange={e=>onUpdate(s.id,'header.referencia',e.target.value)} placeholder="Ej. REF-2024-001"/>
                                </div>
                                <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:10}}>
                                    <div>
                                        <label className="field-label">Talla</label>
                                        <input value={s.header.talla} onChange={e=>onUpdate(s.id,'header.talla',e.target.value)}/>
                                    </div>
                                    <div>
                                        <label className="field-label" style={{color:'#10b981'}}>Tubos / Doc</label>
                                        <input type="number" value={s.header.tubosPorDocena}
                                            onChange={e=>onUpdate(s.id,'header.tubosPorDocena',e.target.value)}
                                            style={{color:'#10b981', fontWeight:800}}/>
                                    </div>
                                </div>
                                <div>
                                    <label className="field-label">Máquina(s) donde puede correr</label>
                                    <p style={{fontSize:10, color:'#4b5563', margin:'0 0 8px'}}>Agregue una opción por cada máquina válida. Dos motivos para tener varias: (a) la misma talla puede correr en más de un modelo/diámetro, o (b) cada opción es en realidad para una talla distinta del mismo producto — en ese caso escriba la talla en esa fila; si la deja vacía, se asume la talla de arriba ({s.header.talla || '—'}).</p>
                                    {getMaquinas(s.header).map((m, mIdx) => (
                                        <div key={mIdx} style={{
                                            background: m.tipoMaquina==='Santoni' ? '#0a1628' : '#091a0f',
                                            border: '1px solid ' + (m.tipoMaquina==='Santoni' ? '#1e3a5f' : '#1a3a22'),
                                            borderRadius:12, padding:12, marginBottom:10, position:'relative'}}>
                                            {getMaquinas(s.header).length > 1 && (
                                                <button onClick={()=>onRemoveMaquina(s.id, mIdx)} title="Quitar esta opción"
                                                    style={{position:'absolute', top:8, right:8, background:'#ef4444', color:'#fff', border:'none',
                                                        borderRadius:6, width:20, height:20, cursor:'pointer', fontSize:12, lineHeight:1}}>×</button>
                                            )}
                                            <div style={{display:'flex', flexDirection:'column', gap:10}}>
                                                <div>
                                                    <label className="field-label" style={{color:'#f59e0b'}}>Talla (opcional)</label>
                                                    <input value={m.talla||''} placeholder={'Vacío = ' + (s.header.talla || 'talla de arriba')}
                                                        onChange={e=>onMachineChange(s.id,mIdx,'talla',e.target.value)}/>
                                                </div>
                                                <div>
                                                    <label className="field-label">Tecnología</label>
                                                    <select value={m.tipoMaquina} onChange={e=>onMachineChange(s.id,mIdx,'tipoMaquina',e.target.value)}>
                                                        <option value="Santoni">Santoni</option>
                                                        <option value="Lonati">Lonati</option>
                                                    </select>
                                                </div>
                                                {m.tipoMaquina === 'Santoni' ? (
                                                    <React.Fragment>
                                                        <div>
                                                            <label className="field-label" style={{color:'#3b82f6'}}>Modelo Santoni</label>
                                                            <select value={m.maquinaModelo} onChange={e=>onMachineChange(s.id,mIdx,'maquinaModelo',e.target.value)}>
                                                                {['TOP2V','TOP2HIE','SM4','TOP1'].map(mo=><option key={mo} value={mo}>{mo}</option>)}
                                                            </select>
                                                        </div>
                                                        <div>
                                                            <label className="field-label" style={{color:'#3b82f6'}}>Diámetro</label>
                                                            <select value={m.diametro} onChange={e=>onMachineChange(s.id,mIdx,'diametro',e.target.value)}>
                                                                {[13,14,15,16,17,18,20,22].map(d=><option key={d} value={d}>{d}" pulgadas</option>)}
                                                            </select>
                                                        </div>
                                                    </React.Fragment>
                                                ) : (
                                                    <div>
                                                        <label className="field-label" style={{color:'#10b981'}}>Modelo Lonati</label>
                                                        <select value={m.maquinaModelo} onChange={e=>onMachineChange(s.id,mIdx,'maquinaModelo',e.target.value)}>
                                                            {['02MJ','04JS','409','416E','B04','B16','GL615','POR DEF'].map(mo=><option key={mo} value={mo}>{mo}</option>)}
                                                        </select>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                    <button onClick={()=>onAddMaquina(s.id)}
                                        style={{background:'#1f2937', color:'#9ca3af', border:'1px dashed #374151', borderRadius:8,
                                            padding:'6px 10px', fontSize:11, fontWeight:700, cursor:'pointer', width:'100%'}}>
                                        + Añadir otra opción de máquina
                                    </button>
                                </div>
                                <div>
                                    <label className="field-label">Alimentadores activos</label>
                                    <input type="number" value={s.header.alimentadores||''} placeholder="Ej. 8"
                                        onChange={e=>onUpdate(s.id,'header.alimentadores',e.target.value)}/>
                                </div>

                                {/* Especificaciones de producción */}
                                <div style={{borderTop:'1px solid #1f2937', paddingTop:16}}>
                                    <h3 style={{margin:'0 0 12px', fontSize:10, fontWeight:800, color:'#4b5563', textTransform:'uppercase', letterSpacing:'0.12em', display:'flex', alignItems:'center', gap:6}}>
                                        <Ico.Clock/> Producción
                                    </h3>
                                    <label className="field-label">Peso unitario (g)</label>
                                    <input type="number" value={s.specs.pesoUnitarioGramos} style={{marginBottom:10, color:'#3b82f6', fontWeight:800}}
                                        onChange={e=>onUpdate(s.id,'specs.pesoUnitarioGramos',e.target.value)}/>

                                    <label className="field-label">Tiempo ciclo máquina</label>
                                    <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:8}}>
                                        <div>
                                            <input type="number" value={s.specs.tiempoMin} placeholder="min"
                                                onChange={e=>onUpdate(s.id,'specs.tiempoMin',e.target.value)}/>
                                            <p style={{fontSize:9, color:'#4b5563', textAlign:'center', margin:'3px 0 0', fontWeight:600}}>MINUTOS</p>
                                        </div>
                                        <div>
                                            <input type="number" value={s.specs.tiempoSeg} placeholder="seg"
                                                onChange={e=>onUpdate(s.id,'specs.tiempoSeg',e.target.value)}/>
                                            <p style={{fontSize:9, color:'#4b5563', textAlign:'center', margin:'3px 0 0', fontWeight:600}}>SEGUNDOS</p>
                                        </div>
                                    </div>
                                </div>

                                {/* Métricas producción */}
                                <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:8}}>
                                    <div style={{background:'#0d1520', border:'1px solid #1f2e42', borderRadius:10, padding:12, textAlign:'center'}}>
                                        <p style={{fontSize:9, color:'#4b5563', margin:'0 0 4px', fontWeight:700, textTransform:'uppercase'}}>Peso Docena</p>
                                        <p className="mono" style={{fontSize:20, fontWeight:700, margin:0, color:'#3b82f6'}}>{dW.toFixed(0)}</p>
                                        <p style={{fontSize:9, color:'#374151', margin:0, fontWeight:600}}>GRAMOS</p>
                                    </div>
                                    <div style={{background: docsPerDay>0 ? '#09201a':'#0d1520', border:`1px solid ${docsPerDay>0?'#065f46':'#1f2e42'}`, borderRadius:10, padding:12, textAlign:'center'}}>
                                        <p style={{fontSize:9, color:'#4b5563', margin:'0 0 4px', fontWeight:700, textTransform:'uppercase'}}>Cap. 24h</p>
                                        <p className="mono" style={{fontSize:20, fontWeight:700, margin:0, color: docsPerDay>0?'#10b981':'#374151'}}>{docsPerDay}</p>
                                        <p style={{fontSize:9, color:'#374151', margin:0, fontWeight:600}}>DOC/DÍA</p>
                                    </div>
                                </div>
                            </div>

                            {/* Columna derecha: Composición */}
                            <div style={{display:'flex', flexDirection:'column', gap:16}}>
                                <div style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
                                    <h3 style={{margin:0, fontSize:10, fontWeight:800, color:'#4b5563', textTransform:'uppercase', letterSpacing:'0.12em'}}>
                                        Composición y torsión
                                    </h3>
                                    <div style={{display:'flex', gap:6}}>
                                        <button
                                            className="no-print"
                                            title="Aplicar composición calculada por titulación a todas las fibras"
                                            onClick={()=>{
                                                composicionSugerida.forEach(sg=>{
                                                    if(sg.porcentaje>0) onFibraUpdate(s.id, sg.idx, 'porcentaje', sg.porcentaje);
                                                });
                                            }}
                                            style={{padding:'5px 11px', borderRadius:8, background:'rgba(16,185,129,0.15)',
                                                border:'1px solid #10b981', color:'#10b981', fontSize:9,
                                                fontWeight:800, cursor:'pointer', textTransform:'uppercase',
                                                letterSpacing:'0.06em', display:'flex', alignItems:'center', gap:4}}>
                                            ⟳ Sugerir %
                                        </button>
                                        <button className="btn btn-emerald no-print" style={{fontSize:10, padding:'5px 12px'}}
                                            onClick={()=>onFibraUpdate(s.id, s.fibras.length, 'nombre', 'Nylon Tex')}>
                                            <Ico.Plus/> Añadir hilo
                                        </button>
                                    </div>
                                </div>

                                <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(260px,1fr))', gap:12}}>
                                    {s.fibras.map((f, fi) => (
                                        <FibraCard key={fi} f={f} fi={fi} sid={s.id}
                                            dW={dW}
                                            onUpdate={onFibraUpdate}
                                            onRemove={onFibraRemove}
                                            canRemove={s.fibras.length > 1}
                                            sugerido={getSugerido(fi)}
                                            totalAlim={s.header.alimentadores||8}
                                         />
                                    ))}
                                </div>

                                {/* Indicador mezcla total */}
                                <div style={{
                                    borderRadius:12, padding:'14px 20px',
                                    display:'flex', justifyContent:'space-between', alignItems:'center',
                                    background: totalPct===100 ? 'rgba(16,185,129,0.12)' : 'rgba(220,38,38,0.08)',
                                    border: `1.5px solid ${totalPct===100?'#10b981':'#dc2626'}`,
                                }}>
                                    <div style={{display:'flex', alignItems:'center', gap:12}}>
                                        {totalPct === 100
                                            ? <span style={{color:'#10b981'}}><Ico.Check/></span>
                                            : <span style={{color:'#ef4444'}}><Ico.Warning/></span>
                                        }
                                        <div>
                                            <p style={{margin:0, fontSize:11, fontWeight:800, color: totalPct===100?'#10b981':'#ef4444', textTransform:'uppercase'}}>
                                                {totalPct===100 ? 'Composición válida' : `Diferencia: ${Math.abs(100-totalPct)}%`}
                                            </p>
                                            <p style={{margin:0, fontSize:9, color:'#4b5563', fontWeight:600}}>
                                                {totalPct===100 ? 'La mezcla suma exactamente 100%' : 'La suma de porcentajes debe ser 100%'}
                                            </p>
                                            {totalPct===100 && textoEtiqueta && (
                                                <div style={{
                                                    marginTop:6, background:'#0a1628',
                                                    border:'1px solid #1e3a5f', borderRadius:7,
                                                    padding:'4px 10px', display:'inline-flex',
                                                    alignItems:'center', gap:6
                                                }}>
                                                    <span style={{fontSize:8, fontWeight:800, color:'#3b82f6', textTransform:'uppercase', letterSpacing:'0.1em'}}>Etiqueta:</span>
                                                    <span style={{fontSize:10, fontWeight:700, color:'#93c5fd', fontFamily:'monospace'}}>{textoEtiqueta}</span>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                    <div style={{display:'flex', alignItems:'center', gap:10}}>
                                        <MiniDonut fibras={s.fibras}/>
                                        <span className="mono" style={{fontSize:28, fontWeight:700, color: totalPct===100?'#10b981':'#ef4444'}}>{totalPct}%</span>
                                    </div>
                                </div>

                                {/* Barra distribución costos */}
                                {totalCost > 0 && (
                                    <div style={{background:'#0d1520', border:'1px solid #1f2e42', borderRadius:12, padding:14}}>
                                        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:10}}>
                                            <p style={{margin:0, fontSize:10, fontWeight:800, color:'#4b5563', textTransform:'uppercase', letterSpacing:'0.1em'}}>
                                                <Ico.Dollar/> Distribución de costo
                                            </p>
                                            <span className="mono" style={{fontSize:16, fontWeight:700, color:'#10b981'}}>${totalCost.toFixed(2)} USD/doc</span>
                                        </div>
                                        <CostBar fibras={s.fibras} dozenW={dW}/>
                                        <div style={{display:'flex', flexWrap:'wrap', gap:8, marginTop:10}}>
                                            {s.fibras.filter(f=>f.porcentaje>0).map((f,i)=>(
                                                <div key={i} style={{display:'flex', alignItems:'center', gap:4, fontSize:10, color:'#6b7280', fontWeight:600}}>
                                                    <span style={{width:8, height:8, borderRadius:2, background:COLORS_BY_TYPE[f.nombre]||'#6b7280', flexShrink:0}}/>
                                                    {f.nombre} {f.titulo && `(${f.titulo})`}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* ── PANEL TORSIONES ── */}
                        <div style={{
                            marginTop:24, background:'linear-gradient(135deg,#0a0e1a,#0d1520)',
                            border:'1px solid #1f2e42', borderRadius:16, padding:20
                        }}>
                            <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:16, flexWrap:'wrap', gap:10}}>
                                <h4 style={{margin:0, fontSize:11, fontWeight:800, color:'#3b82f6', textTransform:'uppercase', letterSpacing:'0.12em'}}>
                                    Resumen consumo por torsión S/Z
                                </h4>
                                <div style={{
                                    background:'rgba(16,185,129,0.1)', border:'1px solid rgba(16,185,129,0.3)',
                                    borderRadius:8, padding:'6px 14px', fontSize:12, fontWeight:800, color:'#10b981'
                                }}>
                                    Costo MP Docena: <span style={{color:'#f1f5f9'}}>${totalCost.toFixed(2)} USD</span>
                                </div>
                            </div>
                            <div style={{display:'flex', flexWrap:'wrap', gap:12}}>
                                {s.fibras.map((f, fi) => {
                                    const gr = dW*(f.porcentaje/100);
                                    const cost = (gr/1000)*(parseFloat(f.costoKg)||0);
                                    const rigid = isRigid(f);
                                    const col = COLORS_BY_TYPE[f.nombre]||'#6b7280';
                                    return (
                                        <div key={fi} style={{
                                            background:'#111827', borderRadius:14, padding:16, minWidth:240, flex:'1 1 240px',
                                            borderLeft:`4px solid ${col}`, border:`1px solid #1f2e42`,
                                            borderLeftWidth:4, borderLeftColor:col
                                        }}>
                                            <div style={{display:'flex', justifyContent:'space-between', marginBottom:10}}>
                                                <div>
                                                    <p style={{margin:0, fontSize:10, fontWeight:800, color:col, textTransform:'uppercase'}}>{f.nombre||'—'}</p>
                                                    <p style={{margin:'2px 0 0', fontSize:9, color:'#4b5563', fontWeight:600}}>
                                                        {f.titulo||'—'} {f.lote?`· ${f.lote}`:''}
                                                    </p>
                                                </div>
                                                <span className="mono" style={{fontSize:10, color:'#4b5563'}}>${(parseFloat(f.costoKg)||0).toFixed(2)}/kg</span>
                                            </div>
                                            {/* totales */}
                                            <div style={{background:'#0d1520', borderRadius:8, padding:'8px 12px',
                                                display:'flex', justifyContent:'space-between', marginBottom:10}}>
                                                <div>
                                                    <p style={{margin:0, fontSize:8, color:'#4b5563', fontWeight:700, textTransform:'uppercase'}}>Consumo total</p>
                                                    <p className="mono" style={{margin:0, fontSize:17, fontWeight:700, color:'#e2e8f0'}}>{gr.toFixed(1)} <small style={{fontSize:9,color:'#4b5563'}}>gr</small></p>
                                                </div>
                                                <div style={{textAlign:'right'}}>
                                                    <p style={{margin:0, fontSize:8, color:'#4b5563', fontWeight:700, textTransform:'uppercase'}}>Costo docena</p>
                                                    <p className="mono" style={{margin:0, fontSize:17, fontWeight:700, color:'#10b981'}}>${cost.toFixed(2)}</p>
                                                </div>
                                            </div>
                                            {/* torsiones */}
                                            {rigid ? (
                                                <div style={{textAlign:'center', padding:'8px 0'}}>
                                                    <span className="badge torsion-r" style={{marginBottom:6}}>Rígido · Sin torsión</span>
                                                    <p className="mono" style={{fontSize:20, fontWeight:700, color:'#e2e8f0', margin:'4px 0 2px'}}>{gr.toFixed(1)} gr</p>
                                                    <p style={{fontSize:10, color:'#4b5563', fontWeight:600}}>{f.itemS||'—'}</p>
                                                </div>
                                            ) : (
                                                <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:8}}>
                                                    {[{label:'S',item:f.itemS,cls:'torsion-s'},{label:'Z',item:f.itemZ,cls:'torsion-z'}].map(t=>(
                                                        <div key={t.label} style={{textAlign:'center', background:'#0d1520', borderRadius:8, padding:10}}>
                                                            <span className={`badge ${t.cls}`} style={{marginBottom:4}}>Tor. {t.label}</span>
                                                            <p className="mono" style={{fontSize:18, fontWeight:700, color:'#e2e8f0', margin:'4px 0 2px'}}>{(gr/2).toFixed(1)} <small style={{fontSize:8,color:'#4b5563'}}>gr</small></p>
                                                            <p style={{fontSize:9, color:'#4b5563', fontWeight:600}}>{t.item||'—'}</p>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                        </div>

                        {/* Observaciones */}
                        <div style={{marginTop:16}}>
                            <label className="field-label" style={{marginBottom:6, display:'block'}}>Observaciones y notas de ingeniería</label>
                            <textarea value={s.observaciones}
                                onChange={e=>onUpdate(s.id,'observaciones',e.target.value)}
