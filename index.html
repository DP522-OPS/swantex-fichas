    // Nombres en etiqueta ICONTEC para composición
    const NOMBRE_ETIQUETA = {

    const isRigid = f => {
        if (!f) return false;
        if (f.nombre==='Nylon Rig' || f.nombre==='Poliester' || f.nombre==='Modal') return true;
        if (f.nombre==='Lycra' && f.titulo && f.titulo.toLowerCase().includes('140')) return true;
        return false;
    };

    /* ══════════════════════════════════════════
       MOTOR DE COMPOSICIÓN POR TITULACIÓN
    ══════════════════════════════════════════ */

    // Obtiene dtex efectivo de un hilo según su título en HILOS_DB
    const getDtexEfectivo = (nombre, titulo) => {
        const preset = HILOS_DB.find(p => p.tipo===nombre && p.titulo===titulo);
        if (preset) return preset.dtex || 0;
        // Si es lycra cubierta manual (denNucleo/dtexCob)
        const t = (titulo||'').toUpperCase();
        // intentar parsear lycra: "22-40-34" → den=22, cob=40
        const mLycra = t.match(/(\d+)-(\d+)/);
        if (nombre==='Lycra' && mLycra) {
            const den = parseFloat(mLycra[1]);
            const cob = parseFloat(mLycra[2]);
            return (den*1.111/3.5) + cob;
        }
        // nylon tex: leer primer número
        const mNylon = t.match(/(\d+)/);
        if ((nombre==='Nylon Tex'||nombre==='Nylon Rig') && mNylon) return parseFloat(mNylon[1]);
        // poliéster: leer primer número
        if (nombre==='Poliester' && mNylon) return parseFloat(mNylon[1]);
        // modal: si tiene Nm leer
        const mNm = t.match(/NM\s*(\d+)/);
        if (nombre==='Modal' && mNm) return 10000/parseFloat(mNm[1]);
        return 0;
    };

    // Verifica si es spandex desnudo (% declarado, no calculado)
    const esSpandexDesnudo = (nombre, titulo) => {
        if (nombre!=='Lycra') return false;
        const preset = HILOS_DB.find(p=>p.tipo===nombre&&p.titulo===titulo);
        return !!(preset && preset.esSpandex) || (titulo||'').toLowerCase().includes('140');
    };

    /*
     * calcularComposicionSugerida(fibras, totalAlim, respuestas)
     *
     * respuestas = {
     *   spandexPct: number,      // % elastómero declarado (cintura, shapewear…)
     *   bodyFreshPct: number,    // % Body Fresh declarado (entrepierna)
     * }
     *
     * Reglas por tipo:
     *  - Modal presente           → preset 85/10/5
     *  - Spandex 140              → respuestas.spandexPct (o default 1)
     *  - Body Fresh               → respuestas.bodyFreshPct (o default 5)
     *  - Lycra cubierta / Nylon / Poliéster → dtex efectivo ponderado por alim
     */
    const esBodyFresh = (f) => {
        const preset = HILOS_DB.find(p=>p.tipo===f.nombre && p.titulo===f.titulo);
        return !!(preset && preset.esBodyFresh);
    };

    const calcularComposicionSugerida = (fibras, totalAlim, respuestas) => {
        const alim = parseInt(totalAlim)||8;
        const resp = respuestas || {};

        // ── Modal: preset fijo ──────────────────────────────────────
        if (fibras.some(f=>f.nombre==='Modal')) {
            return fibras.map((f,i) => {
                if (f.nombre==='Modal')    return {idx:i, porcentaje:85};
                if (f.nombre==='Lycra')    return {idx:i, porcentaje:10};
                return {idx:i, porcentaje:5};
            });
        }

        // ── Identificar fibras especiales ───────────────────────────
        const spandexIdxs   = fibras.map((f,i)=>({f,i})).filter(({f})=>esSpandexDesnudo(f.nombre,f.titulo)).map(({i})=>i);
        const bodyFreshIdxs = fibras.map((f,i)=>({f,i})).filter(({f})=>esBodyFresh(f)).map(({i})=>i);

        const spandexPct   = spandexIdxs.length   ? ((resp.spandexPct != null ? resp.spandexPct : parseFloat(fibras[spandexIdxs[0]].porcentaje) || 1)) : 0;
        const bodyFreshPct = bodyFreshIdxs.length ? ((resp.bodyFreshPct != null ? resp.bodyFreshPct : parseFloat(fibras[bodyFreshIdxs[0]].porcentaje) || 5)) : 0;

        const reservado = spandexPct + bodyFreshPct;
        const baseDisp  = Math.max(0, 100 - reservado);

        // ── dtex ponderado para fibras base (nylon, lycra, poliéster) ─
        const fibraBase = fibras.map((f,i) => {
            if (spandexIdxs.includes(i))   return {idx:i, dtex:0, tipo:'spandex'};
            if (bodyFreshIdxs.includes(i)) return {idx:i, dtex:0, tipo:'bodyFresh'};
            const alimFibra = parseFloat(f.alimFibra)||alim;
            const dtex = getDtexEfectivo(f.nombre, f.titulo);
            return {idx:i, dtex: dtex * (alimFibra/alim), tipo:'base'};
        });

        const totalDtex = fibraBase.reduce((a,x)=>a+x.dtex, 0);

        let resultados = fibraBase.map(x => {
            if (x.tipo==='spandex')   return {idx:x.idx, porcentaje:spandexPct};
            if (x.tipo==='bodyFresh') return {idx:x.idx, porcentaje:bodyFreshPct};
            if (totalDtex===0)        return {idx:x.idx, porcentaje:0};
            return {idx:x.idx, porcentaje: (x.dtex/totalDtex)*baseDisp};
        });

        // ── Redondear y ajustar para sumar 100 ─────────────────────
        let rounded = resultados.map(r=>({...r, porcentaje:Math.round(r.porcentaje)}));
        let suma = rounded.reduce((a,r)=>a+r.porcentaje,0);
        if (suma !== 100) {
            const bases = rounded.filter(r=>fibraBase[r.idx] && fibraBase[r.idx].tipo==='base');
            if (bases.length) {
                const mayor = bases.reduce((a,b)=>b.porcentaje>a.porcentaje?b:a);
                rounded.find(r=>r.idx===mayor.idx).porcentaje += (100-suma);
            }
        }
        return rounded;
    };

    const necesitaAsistente = (fibras) => {
        const tieneSpandex   = fibras.some(f=>esSpandexDesnudo(f.nombre,f.titulo));

        const conTitulo = fibras.filter(f=>f.titulo&&f.titulo!=='');
        if (conTitulo.length < 1) return fibras;
        const sugeridos = calcularComposicionSugerida(fibras, totalAlim||8, respuestas);
        return fibras.map((f,i) => {
            const s = sugeridos.find(x=>x.idx===i);
            if (s && s.porcentaje > 0) return {...f, porcentaje: s.porcentaje};

    const getMaquinas = (h) => {

        if (h.tipoMaquina) return [{ talla:'', tipoMaquina: h.tipoMaquina, maquinaModelo: h.maquinaModelo || '', diametro: h.diametro || '' }];

    /* ══════════════════════════════════════════
       COMPONENTE MINI DONUT
    ══════════════════════════════════════════ */
    const MiniDonut = ({ fibras }) => {
        const total = fibras.reduce((a,f)=>a+(f.porcentaje||0),0);
        if (total === 0) return null;
        let cumul = 0;
        const R = 36, cx = 40, cy = 40, stroke = 14;
        const parts = fibras.filter(f=>f.porcentaje>0).map(f => {
            const pct = (f.porcentaje/total)*100;
            const start = cumul; cumul += pct;
            return { ...f, pct, start };
        });
        const arc = (pct, start) => {
            const r = R, full = 2*Math.PI*r;
            const dash = (pct/100)*full, gap = full - dash;
            const startAngle = (start/100)*2*Math.PI - Math.PI/2;
            const x = cx + r * Math.cos(startAngle);
            const y = cy + r * Math.sin(startAngle);
            return { strokeDasharray:`${dash} ${gap}`, strokeDashoffset: 0,
                     transform:`rotate(${(start/100)*360 - 90} ${cx} ${cy})`,
                     d:`M ${cx} ${cy-r}` };
        };
        return (
            <svg width="80" height="80" viewBox="0 0 80 80">
                <circle cx={cx} cy={cy} r={R} fill="none" stroke="#1f2937" strokeWidth={stroke}/>
                {parts.map((p,i) => {
                    const full = 2*Math.PI*R;
                    const dash = (p.pct/100)*full;
                    const col = COLORS_BY_TYPE[p.nombre] || '#6b7280';
                    const off = (p.start/100)*full;
                    return (
                        <circle key={i} cx={cx} cy={cy} r={R} fill="none"
                            stroke={col} strokeWidth={stroke}
                            strokeDasharray={`${dash} ${full - dash}`}
                            strokeDashoffset={-off}
                            transform={`rotate(-90 ${cx} ${cy})`}
                        />
                    );
                })}
                <text x={cx} y={cy+1} textAnchor="middle" dominantBaseline="middle"
                    fill={total===100?"#10b981":"#ef4444"} fontSize="11" fontWeight="700" fontFamily="JetBrains Mono">
                    {total}%
                </text>
            </svg>
        );
    };

    const CostBar = ({ fibras, dozenW }) => {

        'Nylon Tex':  { bg:'#1a2e4a', border:'#3b82f6', text:'#93c5fd' },
        'Nylon Rig':  { bg:'#2a1a4a', border:'#8b5cf6', text:'#c4b5fd' },
        'Lycra':      { bg:'#0a2e20', border:'#10b981', text:'#6ee7b7' },
        'Poliester':  { bg:'#2e1f0a', border:'#f59e0b', text:'#fcd34d' },
        'Modal':      { bg:'#2e0a1f', border:'#ec4899', text:'#f9a8d4' },
        'Jaspe':      { bg:'#2e0a0a', border:'#ef4444', text:'#fca5a5' },
    };
    const getCol = (nombre) => COLORES[nombre] || { bg:'#1f2937', border:'#4b5563', text:'#9ca3af' };

    const ck = (a, g) => 'a' + a + '_g' + g;

    const clickCell = (a, g) => {
        if (!selHilo) return;
        const newGrid = Object.assign({}, grid);
        if (selHilo === 'CLEAR') {
            delete newGrid[ck(a, g)];
        } else {
            newGrid[ck(a, g)] = {
                nombre:  selHilo.nombre,
                titulo:  selHilo.titulo,
                lote:    selHilo.lote   || '',
                itemS:   selHilo.itemS  || '',
                itemZ:   selHilo.itemZ  || '',
                torsion: selHilo.torsion || null, // 'S' | 'Z' | null (rigido, sin torsion)
            };
        }
        saveGrid(newGrid, numAlim, numGH);
    };

    const clearCell = (a, g) => {
        const newGrid = Object.assign({}, grid);
        delete newGrid[ck(a, g)];
        saveGrid(newGrid, numAlim, numGH);
    };

    const resetGrid = () => {
        if (!window.confirm('¿Resetear todo el enhebrado de esta ficha?')) return;
        saveGrid({}, numAlim, numGH);
    };

    const changeAlim = (v) => {
        const n = parseInt(v);
        setNumAlim(n);
        saveGrid(grid, n, numGH);
    };

    const changeGH = (v) => {
        const n = parseInt(v);
        setNumGH(n);
        saveGrid(grid, numAlim, n);
    };

    const changeFicha = (id) => {
        setFichaId(id);
        setSelHilo(null);
    };

    // Contar asignaciones por hilo (y por torsion, para saber si S y Z
    // quedan balanceados entre los alimentadores - clave para un montaje
    // correcto de hilos con torsion).
    const cuentas = {};
    Object.values(grid).forEach(h => {
        if (!h) return;
        const k = (h.titulo || h.nombre) + (h.torsion ? ' ' + h.torsion : '');
        cuentas[k] = (cuentas[k] || 0) + 1;
    });

    const alims = [];
    for (let i = 1; i <= numAlim; i++) alims.push(i);
    const ghs = [];
    for (let i = 1; i <= numGH; i++) ghs.push(i);

    // Resumen por columna GH (incluye la torsion en la etiqueta)
    const resumenGH = {};
    ghs.forEach(g => {
        const set = {};
        alims.forEach(a => {
            const h = grid[ck(a, g)];
            if (h) set[(h.titulo || h.nombre) + (h.torsion ? ' ' + h.torsion : '')] = h.nombre;
        });
        if (Object.keys(set).length) resumenGH[g] = set;
    });

    if (structures.length === 0) {
        return (
            <div style={{textAlign:'center', padding:60, color:'#4b5563'}}>
                <p style={{fontWeight:700, fontSize:14}}>Crea al menos una ficha en F-CIR-002 primero.</p>
            </div>
        );
    }

    const selCol = selHilo && selHilo !== 'CLEAR' ? getCol(selHilo.nombre) : null;

    return (
        <div style={{paddingBottom:60}}>
            {/* ── HEADER ── */}
            <div style={{background:'#0d1520', border:'1px solid #1f2e42', borderRadius:14,
                padding:'16px 20px', marginBottom:16}}>
                <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start',
                    flexWrap:'wrap', gap:12, marginBottom:14}}>
                    <div>
                        <p style={{margin:'0 0 2px', fontSize:9, fontWeight:800, color:'#10b981',
                            textTransform:'uppercase', letterSpacing:'0.14em'}}>FORMATO FT-CIR-004</p>
                        <h2 style={{margin:'0 0 3px', fontSize:16, fontWeight:900, color:'#f1f5f9',
                            letterSpacing:'-0.02em'}}>
                            MATRIZ GUÍAHILOS × ALIMENTADORES — SANTONI
                        </h2>
                        {ficha && (
                            <p style={{margin:0, fontSize:10, color:'#6b7280'}}>
                                Ficha activa: <span style={{color:'#10b981', fontWeight:700}}>{ficha.nombrePrenda}</span>
                                {ficha.header && ficha.header.referencia
                                    ? ' · ' + ficha.header.referencia : ''}
                            </p>
                        )}
                    </div>
                    <button onClick={resetGrid}
                        style={{padding:'7px 14px', borderRadius:8, background:'#7f1d1d',
                            color:'#fca5a5', border:'1px solid #dc2626', fontWeight:800,
                            fontSize:11, cursor:'pointer', textTransform:'uppercase'}}>
                        ⚡ Resetear
                    </button>
                </div>
                {/* Controles */}
                <div style={{display:'flex', flexWrap:'wrap', gap:12, alignItems:'flex-end'}}>
                    <div>
                        <p style={{margin:'0 0 4px', fontSize:9, fontWeight:700, color:'#4b5563',
                            textTransform:'uppercase'}}>Ficha (F-CIR-002)</p>
                        <select value={fichaId} onChange={e => changeFicha(e.target.value)}
                            style={{minWidth:220, fontWeight:700, fontSize:12}}>
                            {structures.map(s => (
                                <option key={s.id} value={s.id}>
                                    {s.nombrePrenda}{s.header && s.header.referencia ? ' · ' + s.header.referencia : ''}
                                </option>
                            ))}
                        </select>
                    </div>
                    <div>
                        <p style={{margin:'0 0 4px', fontSize:9, fontWeight:700, color:'#4b5563',
                            textTransform:'uppercase'}}>Alimentadores</p>
                        <select value={numAlim} onChange={e => changeAlim(e.target.value)}
                            style={{fontWeight:700, fontSize:12}}>
                            {[4,6,8,10,12,16,20,24].map(n =>
                                <option key={n} value={n}>{n}</option>
                            )}
                        </select>
                    </div>
                    <div>
                        <p style={{margin:'0 0 4px', fontSize:9, fontWeight:700, color:'#4b5563',
                            textTransform:'uppercase'}}>Guíahilos (GH)</p>
                        <select value={numGH} onChange={e => changeGH(e.target.value)}
                            style={{fontWeight:700, fontSize:12}}>
                            {[3,4,5,6,7,8,9,10,12].map(n =>
                                <option key={n} value={n}>{n}</option>
                            )}
                        </select>
                    </div>
                </div>
            </div>

            {/* ── PALETA DE HILOS ── */}
            <div style={{background:'#111827', border:'1px solid #1f2937', borderRadius:12,
                padding:'12px 16px', marginBottom:12}}>
                <p style={{margin:'0 0 10px', fontSize:9, fontWeight:800, color:'#6b7280',
                    textTransform:'uppercase', letterSpacing:'0.12em'}}>
                    SELECCIONA UN HILO → LUEGO HAZ CLIC EN LA CELDA
                </p>
                <div style={{display:'flex', flexWrap:'wrap', gap:8, alignItems:'center'}}>
                    {hilosDisp.length === 0 && (
                        <p style={{color:'#4b5563', fontSize:11, fontStyle:'italic', margin:0}}>
                            Esta ficha no tiene fibras con título. Edítala en F-CIR-002.
                        </p>
                    )}
                    {hilosDisp.flatMap((h, hi) => {
                        // Si el hilo tiene torsion (S/Z, ej. cubiertas de licra), se
                        // ofrece una ficha por cada torsion, para que quede claro en
                        // la matriz cual item (S o Z) va en cada alimentador - eso es
                        // justo lo que hace efectivo el montaje. Los hilos rigidos
                        // (sin torsion) siguen como una sola opcion.
                        const opciones = isRigid(h)
                            ? [{ torsion: null }]
                            : [h.itemS ? { torsion:'S' } : null, h.itemZ ? { torsion:'Z' } : null].filter(Boolean);
                        const lista = opciones.length ? opciones : [{ torsion: null }];
                        return lista.map((op, oi) => {
                            const hOp = Object.assign({}, h, { torsion: op.torsion });
                            const col  = getCol(h.nombre);
                            const cntKey = h.titulo || h.nombre;
                            const cnt  = cuentas[cntKey + (op.torsion ? ' ' + op.torsion : '')] || 0;
                            const actv = selHilo && selHilo !== 'CLEAR'
                                && selHilo.titulo === h.titulo && selHilo.nombre === h.nombre
                                && selHilo.torsion === op.torsion;
                            return (
                                <button key={hi+'-'+oi} onClick={() => setSelHilo(actv ? null : hOp)}
                                    style={{display:'flex', alignItems:'center', gap:7,
                                        background: actv ? col.border : col.bg,
                                        border:'2px solid ' + (actv ? col.text : col.border),
                                        borderRadius:9, padding:'6px 12px', cursor:'pointer',
                                        outline:'none', transition:'all 0.15s'}}>
                                    <span style={{width:8, height:8, borderRadius:'50%',
                                        background: actv ? '#fff' : col.border, flexShrink:0}}/>
                                    <span style={{fontSize:11, fontWeight:800,
                                        color: actv ? '#fff' : col.text}}>
                                        {h.titulo}
                                    </span>
                                    <span style={{fontSize:9, color: actv ? '#ffffffaa' : col.border,
                                        fontWeight:600}}>({h.nombre})</span>
                                    {op.torsion && (
                                        <span className={'badge torsion-' + op.torsion.toLowerCase()}
                                            style={{fontSize:9, fontWeight:900, padding:'1px 6px', borderRadius:99}}>
                                            {op.torsion}
                                        </span>
                                    )}
                                    {cnt > 0 && (
                                        <span style={{background: actv ? '#ffffff33' : col.border+'44',
                                            color: actv ? '#fff' : col.text,
                                            fontSize:9, fontWeight:800,
                                            padding:'1px 6px', borderRadius:99}}>
                                            {cnt}×
                                        </span>
                                    )}
                                </button>
                            );
                        });
                    })}
                    {/* Borrador */}
                    <button onClick={() => setSelHilo(selHilo === 'CLEAR' ? null : 'CLEAR')}
                        style={{display:'flex', alignItems:'center', gap:6,
                            background: selHilo === 'CLEAR' ? '#dc2626' : '#1f0a0a',
                            border:'2px solid #dc2626', borderRadius:9, padding:'6px 12px',
                            cursor:'pointer', outline:'none', transition:'all 0.15s'}}>
                        <span style={{color: selHilo === 'CLEAR' ? '#fff' : '#f87171',
                            fontSize:11, fontWeight:800}}>
                            ✕ Borrar celda
                        </span>
                    </button>
                </div>

                {/* Indicador hilo activo */}
                {selHilo && (
                    <div style={{marginTop:10, padding:'6px 12px', borderRadius:8,
                        background: selHilo === 'CLEAR'
                            ? 'rgba(220,38,38,0.15)' : 'rgba(16,185,129,0.1)',
                        border: '1px solid ' + (selHilo === 'CLEAR' ? '#dc2626' : '#10b981'),
                        fontSize:11, fontWeight:700,
                        color: selHilo === 'CLEAR' ? '#fca5a5' : '#6ee7b7',
                        display:'inline-block'}}>
                        {selHilo === 'CLEAR'
                            ? '✕ Modo borrar — haz clic en cualquier celda para vaciarla'
                            : '→ Clic en cualquier celda para colocar: ' + selHilo.titulo + (selHilo.torsion ? ' (' + selHilo.torsion + ')' : '')}
                    </div>
                )}
            </div>

            {/* ── MATRIZ ── */}
            <div style={{overflowX:'auto', borderRadius:12, border:'1px solid #1f2937'}}>
                <table style={{borderCollapse:'collapse', minWidth: 100 + numGH * 110, width:'100%'}}>
                    <thead>
                        <tr>
                            <th style={{background:'#0a0e1a', color:'#374151', fontSize:9,
                                fontWeight:800, textTransform:'uppercase', padding:'10px 14px',
                                border:'1px solid #1f2937', minWidth:80,
                                position:'sticky', left:0, zIndex:3}}>
                                ALIM.
                            </th>
                            {ghs.map(g => (
                                <th key={g} style={{
                                    background: resumenGH[g] ? '#0a1f2e' : '#0a0e1a',
                                    color: resumenGH[g] ? '#10b981' : '#2a3a50',
                                    fontSize:9, fontWeight:800, textTransform:'uppercase',
                                    padding:'8px 6px', border:'1px solid #1f2937',
                                    minWidth:110, textAlign:'center'}}>
                                    GH #{g}
                                    {resumenGH[g] && (
                                        <div style={{fontSize:7, color:'#4b5563',
                                            fontWeight:600, marginTop:2, textTransform:'none'}}>
                                            {Object.keys(resumenGH[g]).map(t =>
                                                t.length > 12 ? t.slice(0,10)+'…' : t
                                            ).join(', ')}
                                        </div>
                                    )}
                                </th>
                            ))}
                        </tr>
                    </thead>
                    <tbody>
                        {alims.map(a => (
                            <tr key={a}>
                                <td style={{background:'#0a0e1a', color:'#6b7280', fontSize:10,
                                    fontWeight:800, padding:'0 14px', border:'1px solid #1f2937',
                                    textAlign:'center', position:'sticky', left:0, zIndex:1,
                                    whiteSpace:'nowrap', height:46}}>
                                    ALIM #{a}
                                </td>
                                {ghs.map(g => {
                                    const hilo = grid[ck(a, g)];
                                    const col  = hilo ? getCol(hilo.nombre) : null;
                                    const canClick = !!selHilo;
                                    return (
                                        <td key={g}
                                            onClick={() => clickCell(a, g)}
                                            style={{
                                                border:'1px solid #1f2937',
                                                background: hilo ? col.bg : '#0a0e1a',
                                                padding:'4px 6px', textAlign:'center',
                                                minWidth:110, height:46,
                                                cursor: canClick ? 'pointer' : 'default',
                                                transition:'background 0.1s',
                                                outline: canClick ? '2px dashed #10b98133' : 'none',
                                            }}>
                                            {hilo ? (
                                                <div style={{display:'flex', alignItems:'center',
                                                    justifyContent:'center', gap:4}}>
                                                    <span style={{width:6, height:6, borderRadius:'50%',
                                                        background:col.border, flexShrink:0}}/>
                                                    <span style={{fontSize:10, fontWeight:800,
                                                        color:col.text, lineHeight:1.2}}>
                                                        {(hilo.titulo||hilo.nombre).length > 16
                                                            ? (hilo.titulo||hilo.nombre).slice(0,14)+'…'
                                                            : (hilo.titulo||hilo.nombre)}
                                                    </span>
                                                    {hilo.torsion && (
                                                        <span className={'badge torsion-' + hilo.torsion.toLowerCase()}
                                                            style={{fontSize:11, fontWeight:900, padding:'1px 7px', borderRadius:99, flexShrink:0, lineHeight:1.2}}>
                                                            {hilo.torsion}
                                                        </span>
                                                    )}
                                                    <button
                                                        onClick={e => { e.stopPropagation(); clearCell(a,g); }}
                                                        style={{marginLeft:2, background:'none', border:'none',
                                                            color:'#4b5563', cursor:'pointer', fontSize:12,
                                                            lineHeight:1, padding:'0 2px',
                                                            opacity:0.6}}
                                                        title="Borrar celda">×</button>
                                                </div>
                                            ) : (
                                                <span style={{color: canClick ? '#2a3a50' : '#1a2535',
                                                    fontSize:14}}>—</span>
                                            )}
                                        </td>
                                    );
                                })}
                            </tr>
                        ))}
                    </tbody>
                </table>
            </div>

            {/* ── INSTRUCCIONES ── */}
            <div style={{marginTop:12, display:'flex', flexWrap:'wrap', gap:16,
                fontSize:10, color:'#374151'}}>
                {[
                    ['Seleccionar hilo', 'Haz clic en un hilo de la paleta (queda resaltado)'],
                    ['Colocar en celda', 'Haz clic en cualquier celda de la matriz'],
                    ['Borrar celda',     'Usa "✕ Borrar celda" o el × dentro de cada celda'],
                    ['Cambiar ficha',    'Cada ficha guarda su propio enhebrado automáticamente'],
                    ['Torsión S / Z',    'Los hilos con torsión aparecen como dos fichas (S y Z) en la paleta; cada celda queda marcada con cuál va, para armar el montaje sin confundirlas'],
                ].map(function(item, i) {
                    return (
                        <div key={i} style={{display:'flex', gap:6, alignItems:'flex-start'}}>
                            <span style={{color:'#10b981', fontWeight:800, flexShrink:0}}>→</span>
                            <span>
                                <strong style={{color:'#6b7280'}}>{item[0]}:</strong> {item[1]}
                            </span>
                        </div>
                    );
                })}
            </div>
        </div>
    );
};



    /* ══════════════════════════════════════════
       FT-CIR-004 — FICHA TÉCNICA DE MEDIDAS
       Aprobación / Estructura / Medidas Crudo
    ══════════════════════════════════════════ */
    const FT004Tab = ({ structures }) => {
        const SKEY = 'swantex_ft004_v2';

        /* ── Tabla de usuarios autorizados ── */
        const USUARIOS = {
            'MO-4821': 'Milena Ortiz',
            'JA-7356': 'Julio Aragón',
            'JM-2947': 'Jhon Murcia',
            'JZ-6183': 'Jhonatan Zipa',
            'DP-9034': 'David Posada',
        };
        // Jefaturas — Aprobación final liberación a producción
        const JEFATURAS = {
            'BF-3817': { nombre:'Bella Forero',    rol:'Armado y Calidad' },
            'MA-6524': { nombre:'Marisol Álvarez', rol:'Corsetería' },
            'PL-9043': { nombre:'Paola López',     rol:'Calidad' },
            'CP-7261': { nombre:'Camila Prias',    rol:'Diseño' },
        };

        /* ── Email & URL helpers ── */
        const CFG = window.SWANTEX_CONFIG || {};

        // Compress ficha data into URL-safe base64
        const fichaToLink = (ficha, rolKey) => {
            return (CFG.BASE_URL||'https://dp522-ops.github.io/swantex-fichas') +
                '?fichaId=' + encodeURIComponent(ficha.id) + '&rol=' + encodeURIComponent(rolKey);
        };
        // Un solo link que abre VARIAS fichas para una jefatura
        const fichasToLink = (lista, rolKey) => {
            return (CFG.BASE_URL||'https://dp522-ops.github.io/swantex-fichas') +
                '?fichaIds=' + lista.map(function(f){ return encodeURIComponent(f.id); }).join(',') +
                '&rol=' + encodeURIComponent(rolKey);
        };
        // Campo de aprobación de cada código de jefatura
        const APR_KEY_POR_ROL = {'BF-3817':'aproboArmado','MA-6524':'aproboCorseteria','PL-9043':'aproboCalidad','CP-7261':'aproboDiseno'};

        // Tallas marcadas en una ficha, ej. "S-M" — para distinguir fichas del mismo producto
        const tallasDeFicha = (ficha) => {
            try {
                var tc = (ficha && ficha.tallasCheck) || {};
                var tl = Object.keys(tc).filter(function(t){ return tc[t]; });
                if (ficha.tallaExtra) tl.push(ficha.tallaExtra);
                return tl.join('-');
            } catch(e) { return ''; }
        };
        const nombreFichaCorto = (ficha) => {
            var t = tallasDeFicha(ficha);
            return (ficha.producto || 'Sin producto') + (t ? ' (' + t + ')' : '');
        };
        // Texto legible de un error de EmailJS (vienen como {status, text})
        const errorEmailTxt = (e) => {
            if (!e) return 'error desconocido';
            if (typeof e === 'string') return e;
            var st = e.status, tx = e.text || e.message;
            if (st || tx) return (st ? '[' + st + '] ' : '') + (tx || '');
            try { return JSON.stringify(e); } catch(x) { return String(e); }
        };

        // Send approval email to one jefatura role
        const enviarCorreoAprobacion = (ficha, rolKey) => {
            const jef = CFG.JEFATURAS_CORREO && CFG.JEFATURAS_CORREO[rolKey];
            if (!jef) return Promise.reject('Rol no encontrado');
            const link = fichaToLink(ficha, rolKey);
            // Tallas de la ficha — para distinguir fichas duplicadas en el correo
            var tallasTxt = tallasDeFicha(ficha);
            const params = {
                to_email:        jef.correos.join(','),
                nombre_jefatura: jef.nombre,
                rol:             jef.rol,
                producto:        (ficha.producto || '—') + (tallasTxt ? ' · Talla ' + tallasTxt : ''),
                lcc:             ficha.lcc      || '—',
                tem:             ficha.tem      || '—',
                link_aprobacion: link,
                correo_copia:    CFG.CORREO_CIRCULARES || '',
            };
            if (!CFG.EMAILJS_KEY || CFG.EMAILJS_KEY === 'TU_PUBLIC_KEY') {
                console.warn('EmailJS no configurado. Link generado:', link);
                return Promise.resolve({ link });
            }
            window.emailjs.init(CFG.EMAILJS_KEY);
            return enviarConPausa(params);
        };

        // UN solo correo para una jefatura con TODAS sus fichas (ahorra cuota de EmailJS)
        // Usa la misma plantilla: el link abre todas las fichas juntas
        const enviarCorreoGrupo = (lista, rolKey) => {
            if (!lista || lista.length === 0) return Promise.resolve(null);
            if (lista.length === 1) return enviarCorreoAprobacion(lista[0], rolKey);
            const jef = CFG.JEFATURAS_CORREO && CFG.JEFATURAS_CORREO[rolKey];
            if (!jef) return Promise.reject('Rol no encontrado');
            const link = fichasToLink(lista, rolKey);
            const unicos = function(campo){
                var vals = [];
                lista.forEach(function(f){ var v = (f[campo]||'').toString().trim(); if (v && vals.indexOf(v) < 0) vals.push(v); });
                return vals.length ? vals.join(', ') : '—';
            };
            const params = {
                to_email:        jef.correos.join(','),
                nombre_jefatura: jef.nombre,
                rol:             jef.rol,
                producto:        lista.length + ' fichas: ' + lista.map(nombreFichaCorto).join(' · '),
                lcc:             unicos('lcc'),
                tem:             unicos('tem'),
                link_aprobacion: link,
                correo_copia:    CFG.CORREO_CIRCULARES || '',
            };
            if (!CFG.EMAILJS_KEY || CFG.EMAILJS_KEY === 'TU_PUBLIC_KEY') {
                console.warn('EmailJS no configurado. Link generado:', link);
                return Promise.resolve({ link });
            }
            window.emailjs.init(CFG.EMAILJS_KEY);
            return enviarConPausa(params);
        };

        // EmailJS acepta máx. 1 correo/segundo — esperar entre envíos y reintentar si rechaza (429)
        var __ultimoEnvio = 0;
        const esperar = (ms) => new Promise(function(r){ setTimeout(r, ms); });
        const enviarConPausa = async (params) => {
            for (var intento = 0; intento < 4; intento++) {
                var faltan = 1300 - (Date.now() - __ultimoEnvio);
                if (faltan > 0) await esperar(faltan);
                __ultimoEnvio = Date.now();
                try {
                    return await window.emailjs.send(CFG.EMAILJS_SERVICE, CFG.EMAILJS_TPL, params);
                } catch(e) {
                    var st = e && e.status;
                    if (st === 429 && intento < 3) { await esperar(2500); continue; }
                    throw e;
                }
            }

        const getFB = function(){ return window.SWANTEX_FIREBASE || null; };

        /* ── Guardar ficha completa en Firestore ── */
        /* Sanitize for Firestore — fields cannot start AND end with __ */
        /* Deep clean object for Firestore */
        const cleanForFirestore = function(input) {
            var str = JSON.stringify(input, function(key, val) {
                if (typeof val === 'function') return undefined;
                return val;
            });
            // Replace all "__xxx__" patterns with "xXxxXx" style
            str = str.replace(/"__([^"]+)__"\s*:/g, '"_fb_$1_":');
            return JSON.parse(str);
        };
        const restoreFromFirestore = function(input) {
            var str = JSON.stringify(input);
            str = str.replace(/"_fb_([^"]+)_"\s*:/g, '"__$1__":');
            return JSON.parse(str);
        };
        const sanitizeForFirestore = cleanForFirestore;

        const fbGuardarFicha = async (ficha) => {
            const FB = getFB();
            if (!FB || !FB.db) return { ok:false, err:'Firebase no conectado' };
            try {
                const safe = cleanForFirestore(Object.assign({}, ficha, {
                    _updatedAt: Date.now(),
                    _updatedBy: 'elaboro',
                }));
                await FB.db.collection('fichas').doc(ficha.id).set(safe);
                return { ok:true };
            } catch(e) {
                console.error('Firebase save error:', e);
                return { ok:false, err:String(e) };
            }
        };
        /* ── Leer ficha de Firestore ── */
        const fbLeerFicha = async (fichaId) => {
            const FB = getFB();
            if (!FB || !FB.db) return null;
            try {
                const snap = await FB.db.collection('fichas').doc(fichaId).get();
                if (!snap.exists) return null;
                return restoreFromFirestore(snap.data());
            } catch(e) { console.error('Firebase read error:', e); return null; }
        };

        const fbGuardarFirma = async (fichaId, campo, datos) => {

            try {
                const upd = {};
                upd[campo] = datos;
                upd['_updatedAt'] = Date.now();
                await FB.db.collection('fichas').doc(fichaId).update(upd);
                return { ok:true };
            } catch(e) { return { ok:false, err:String(e) }; }
        };

            obs:        '',
            fromPrecosteo: true,
        }));
        const calcEstructura = (ref, actual) => {
            const liveRows = filasDePrecosteo(ref);
            const prevAuto   = (actual || []).filter(r => r.fromPrecosteo !== false);
            const manualRows = (actual || []).filter(r => r.fromPrecosteo === false);
            const keyOf = (arr) => arr.map(r => [r.hilo,r.torsion,r.lote,r.proveedor].join('§')).join('|');
            if (keyOf(liveRows) === keyOf(prevAuto)) return null; // ya está al día
            const usados = {};
            const merged = liveRows.map(lr => {
                let mi = -1;
                for (let i = 0; i < prevAuto.length; i++) { if (!usados[i] && prevAuto[i].hilo === lr.hilo) { mi = i; break; } }
                if (mi < 0) return lr;
                usados[mi] = true;
                const match = prevAuto[mi];
                return Object.assign({}, lr, {
                    parte:  match.parte  || lr.parte,
                    tejido: match.tejido || '',
                    obs:    match.obs    || '',
                });
            });
            // filas manuales completamente vacías no aportan nada: se limpian
            const manualUtiles = manualRows.filter(r => (r.hilo || r.lote || r.proveedor || r.obs || r.tejido));
            return merged.concat(manualUtiles);
        };
        const [syncTick, setSyncTick] = useState(0);
        useEffect(() => {
            if (!ficha || !ficha.fichaRefId) return;
            const ref = structures.find(s => s.id === ficha.fichaRefId);
            if (!ref) return;
            const nuevo = calcEstructura(ref, ficha.estructura);
            if (nuevo) upd(ficha.id, 'estructura', nuevo);
        }, [ficha && ficha.id, ficha && ficha.fichaRefId, structures, syncTick]);
        const tallasActivas = ficha
            ? TALLAS_DEF.filter(t=>ficha.tallasCheck[t])
              .concat(ficha.tallaExtra ? [ficha.tallaExtra] : [])

        const statusColor = {BORRADOR:'#6b7280',REVISIÓN:'#3b82f6',APROBADO:'#10b981'};

                                    style={Object.assign({},S.inp,{maxWidth:180})}/>

                        </div>

                        {/* ─── COMPLEMENTOS ─── */}
                        {(()=>{

                                                    var rItem = await fbGuardarFicha(fItem);
                                                    var syncOk = rItem.ok;
                                                    setFbSyncStatus(function(p){ return Object.assign({},p,{[syncId]:syncOk?'synced':'error'}); });
                                                    if(!rItem.ok){ errores.push(nombreFichaCorto(fItem)); continue; }
                                                    guardadas.push(fItem);

                                                guardadas.forEach(function(fg){
                                                    var rolesF = fg.rolesAprobadores||{'BF-3817':true,'MA-6524':true,'PL-9043':true,'CP-7261':true};
                                                    ordenRoles.forEach(function(rk){

                                                        (porRol[rk] = porRol[rk] || []).push(fg);

                                                    var rk = rolesConFichas[j];

                                                    try { await enviarCorreoGrupo(porRol[rk], rk); correosOk++; }
                                                    catch(e){
                                                        console.warn('Email error',rk,e);
                                                        correosFallidos.push((jefE?jefE.nombre:rk)+' ('+porRol[rk].length+' ficha/s)');
                                                        var motivo = errorEmailTxt(e);
                                                        if(motivosError.indexOf(motivo)<0) motivosError.push(motivo);
                                                        // Si el primer correo falla (no por velocidad), es un problema de EmailJS: no seguir gastando intentos
                                                        if(correosOk===0 && !(e && e.status===429)){ abortado = true; break; }
                                                    }
                                                }
                                                var detalle = rolesConFichas.map(function(rk){
                                                    var jf = CFG.JEFATURAS_CORREO[rk];
                                                    return (jf?jf.nombre.split(' ')[0]:rk)+': '+porRol[rk].length;
                                                }).join(' · ');
                                                var notaAprob = yaAprobadas===1 ? ' (1 aprobación ya estaba hecha y no se reenvió)'

                                                if(errores.length>0 || correosFallidos.length>0){

                                                    if(abortado) partes.push('Se detuvo el envío en el primer error');
                                                    if(errores.length>0) partes.push('No se guardaron en la nube: '+errores.join(', '));

                                                } else {
                                                    setResultadoTodas({ok:true, msg:'✅ '+correosOk+' correo(s) enviados — uno por jefatura ('+detalle+' fichas)'+notaAprob});
                                                }

                                                setResultadoTodas({ok:false, msg:'Error: '+String(err)});
                                            }
                                            setEnviandoTodas(false);
                                        }}

                                            {apr.bloqueado?'✓ ':'○ '}{item.label}
                                        </span>
                                    );
                                })}
                                {(['aproboArmado','aproboCorseteria','aproboCalidad','aproboDiseno'].every(function(k){return (ficha[k]||{}).bloqueado;})) && (
                                    <span style={{marginLeft:'auto',padding:'4px 14px',borderRadius:99,
                                        fontWeight:900,fontSize:10,background:'#10b981',color:'#fff',
                                        letterSpacing:'0.06em',textTransform:'uppercase'}}>

    };


    const App = () => {
        const [structures, setStructures] = useState([]);
        const [isExporting, setIsExporting] = useState(false);
        const [searchQuery, setSearchQuery] = useState('');
        const [filterStatus, setFilterStatus] = useState('TODOS');
        const [expandedId, setExpandedId] = useState(null);
        const [activeTab, setActiveTab] = useState(function(){
            // Link de aprobación de jefatura → abrir directo en FT-CIR-004
            try {
                var q = new URLSearchParams(window.location.search);
                if (q.get('fichaId') || q.get('fichaIds')) return 'ftcir004';
            } catch(e) {}
            return 'precosteos';
        });
        const fileInputRef = useRef(null);
        const printRef = useRef(null);

        /* ── Persistencia ── */
        useEffect(() => {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (Array.isArray(parsed) && parsed.length > 0) { setStructures(parsed); return; }
                }
            } catch(e) {}
            setStructures([newStructure()]);
        }, []);

        const persist = useCallback((data) => {
            setStructures(data);
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) {}
        }, []);

        /* ── Sincronización a la nube (Firestore: colección "fichas", la
           misma que usan las fichas FT-CIR-004 — comparten colección porque
           los permisos de Firestore ya están abiertos ahí; se distinguen
           por el prefijo del id: "SW-" Precosteo vs "FT004-" FT-CIR-004, y
           SWAN2 ya descarta los documentos que no tengan forma de Precosteo).
           SWAN2 (catálogo de referencias, Planeación, Materia Prima) lee esta
           colección para saber máquina/diámetro/tiempos/composición de cada
           referencia. Antes, Precosteo sólo se guardaba en localStorage del
           computador donde se llenaba la ficha y nunca llegaba a SWAN2. ── */
        const [cloudSyncStatus, setCloudSyncStatus] = useState('');
        const prevStructuresRef = useRef(structures);
        const cloudInitDoneRef  = useRef(false);
        const cloudSaveTimerRef = useRef(null);

        // Sincronización inicial: sube TODO lo que ya existe en este computador
        // la primera vez que Firebase queda listo (una sola vez).
        useEffect(() => {
            if (cloudInitDoneRef.current) return;
            if (!structures || structures.length === 0) return;
            let cancelado = false;
            const intentar = (restantes) => {
                if (cancelado) return;
                const fb = window.SWANTEX_FIREBASE;
                if (fb && fb.db) {
                    cloudInitDoneRef.current = true;
                    setCloudSyncStatus('syncing');
                    Promise.all(structures.map((s) =>
                        (window.SWSAFE ? window.SWSAFE.guardarPrecosteo(s) : fb.db.collection('fichas').doc(s.id).set(s))
                            .catch((e) => console.warn('Error sincronizando precosteo inicial', s.id, e))
                    )).then(() => setCloudSyncStatus('synced'));
                } else if (restantes > 0) {
                    setTimeout(() => intentar(restantes - 1), 300);
                }
            };
            intentar(30);
            return () => { cancelado = true; };
        }, [structures]);

        // Sincronización continua: cada vez que cambia una estructura (crear,
        // editar, borrar), se refleja en la nube unos segundos después.
        useEffect(() => {
            const prev = prevStructuresRef.current;
            prevStructuresRef.current = structures;
            if (!cloudInitDoneRef.current) return; // aún no hizo la subida inicial
            const fb = window.SWANTEX_FIREBASE;
            if (!fb || !fb.db) return;
            if (cloudSaveTimerRef.current) clearTimeout(cloudSaveTimerRef.current);
            cloudSaveTimerRef.current = setTimeout(() => {
                let huboCambios = false;
                structures.forEach((s) => {
                    const antes = prev.find((p) => p.id === s.id);
                    if (antes && JSON.stringify(antes) === JSON.stringify(s)) return;
                    huboCambios = true;
                    (window.SWSAFE ? window.SWSAFE.guardarPrecosteo(s) : fb.db.collection('fichas').doc(s.id).set(s))
                        .catch((e) => console.warn('Error guardando precosteo en la nube', s.id, e));
                });
                const idsActuales = {};
                structures.forEach((s) => { idsActuales[s.id] = true; });
                prev.forEach((p) => {
                    if (!idsActuales[p.id]) {
                        huboCambios = true;
                        (window.SWSAFE ? window.SWSAFE.papelera(p) : fb.db.collection('fichas').doc(p.id).delete().catch(() => {}));
                    }
                });
                if (huboCambios) {
                    setCloudSyncStatus('synced');
                    setTimeout(() => setCloudSyncStatus(''), 2500);
                }
            }, 1200);
        }, [structures]);

        /* ── Resumen global ── */
        const globalSummary = useMemo(() => {
            let totalCost = 0, totalGr = 0;
            structures.forEach(s => {
                const tubos = parseInt(s.header.tubosPorDocena)||12;
                const dW = (parseFloat(s.specs.pesoUnitarioGramos)||0) * tubos;
                s.fibras.forEach(f => {
                    const gr = dW * (f.porcentaje/100);
                    totalGr += gr;
                    totalCost += (gr/1000)*(parseFloat(f.costoKg)||0);
                });
            });
            return { totalCost, totalKg: totalGr/1000, count: structures.length };
        }, [structures]);

        /* ── Filtros ── */
        const visibleStructures = useMemo(() => {
            let arr = structures;
            if (filterStatus !== 'TODOS') arr = arr.filter(s => s.status === filterStatus);
            if (searchQuery.trim()) {
                const q = searchQuery.toLowerCase();
                arr = arr.filter(s =>
                    s.nombrePrenda.toLowerCase().includes(q) ||
                    (s.header.referencia||'').toLowerCase().includes(q) ||
                    s.fibras.some(f => f.nombre.toLowerCase().includes(q) || f.titulo.toLowerCase().includes(q))
                );
            }
            return arr;
        }, [structures, filterStatus, searchQuery]);

        /* ── Mutaciones ── */
        const updateField = (id, path, val) => {
            const keys = path.split('.');
            const newData = structures.map(s => {
                if (s.id !== id) return s;
                const clone = JSON.parse(JSON.stringify(s));
                let cur = clone;
                for (let i = 0; i < keys.length-1; i++) cur = cur[keys[i]];
                cur[keys[keys.length-1]] = val;
                clone.updatedAt = Date.now();
                return clone;
            });
            persist(newData);
        };

        // idx = indice de la opcion de maquina dentro de header.maquinas. field = 'tipoMaquina'|'maquinaModelo'|'diametro'.
        const handleMachineChange = (id, idx, field, val) => {
            const newData = structures.map(s => {
                if (s.id !== id) return s;
                const clone = JSON.parse(JSON.stringify(s));
                const lista = getMaquinas(clone.header).slice();
                const item = Object.assign({}, lista[idx]);
                item[field] = val;
                if (field === 'tipoMaquina') {
                    item.maquinaModelo = val === 'Santoni' ? 'TOP2V' : '02MJ';
                    item.diametro = val === 'Santoni' ? '17' : '';
                }
                lista[idx] = item;
                clone.header.maquinas = lista;
                clone.updatedAt = Date.now();
                return clone;
            });
            persist(newData);
        };

        const addMaquinaOpcion = (id) => {
            const newData = structures.map(s => {
                if (s.id !== id) return s;
                const clone = JSON.parse(JSON.stringify(s));
                const lista = getMaquinas(clone.header).slice();
                lista.push({ talla:'', tipoMaquina:'Santoni', maquinaModelo:'TOP2V', diametro:'17' });
                clone.header.maquinas = lista;
                clone.updatedAt = Date.now();
                return clone;
            });
            persist(newData);
        };

        const removeMaquinaOpcion = (id, idx) => {
            const newData = structures.map(s => {
                if (s.id !== id) return s;
                const clone = JSON.parse(JSON.stringify(s));
                const lista = getMaquinas(clone.header).slice();
                if (lista.length <= 1) return clone; // siempre debe quedar al menos una
                lista.splice(idx, 1);
                clone.header.maquinas = lista;
                clone.updatedAt = Date.now();
                return clone;
            });
            persist(newData);
        };

        const updateFibra = (sid, idx, field, val) => {
            const newData = structures.map(s => {
                if (s.id !== sid) return s;
                const clone = JSON.parse(JSON.stringify(s));
                let fibras = [...clone.fibras];

                // add new row if idx === length
                if (idx === fibras.length) fibras.push(newFibra());

                let f = { ...fibras[idx] };

                if (field === 'nombre') {
                    f = { ...newFibra(), nombre: val };
                } else if (field === 'titulo') {
                    if (val === 'CUSTOM') {
                        f = { ...f, titulo:'', lote:'', itemS:'', itemZ:'', proveedor:'', customTitulo:true, customLote:true };
                    } else {
                        f.titulo = val;
                        f.customTitulo = false;
                        const preset = HILOS_DB.find(p => p.tipo === f.nombre && p.titulo === val);
                        if (preset) {
                            f.lote = preset.lote; f.itemS = preset.itemS;
                            f.itemZ = preset.itemZ; f.proveedor = preset.proveedor;
                            f.customLote = false;
                        } else {
                            f.lote=''; f.itemS=''; f.itemZ=''; f.proveedor='';
                        }
                    }
                } else if (field === 'lote') {
                    if (val === 'CUSTOM') {
                        f = { ...f, lote:'', itemS:'', itemZ:'', customLote:true };
                    } else {
                        f.lote = val;
                        f.customLote = false;
                        const preset = HILOS_DB.find(p => p.tipo===f.nombre && p.titulo===f.titulo && p.lote===val);
                        if (preset) { f.itemS = preset.itemS; f.itemZ = preset.itemZ; f.proveedor = preset.proveedor; }
                    }
                } else if (field === 'titulo_raw') { f.titulo = val; }
                else if (field === 'lote_raw')   { f.lote = val; }
                else if (field === 'porcentaje' || field === 'costoKg') { f[field] = parseFloat(val)||0; }
                else { f[field] = val; }

                fibras[idx] = f;
                if (field === 'nombre' || field === 'titulo' || field === 'alimFibra') fibras = applyTechnicalRules(fibras, clone.header.alimentadores);
                clone.fibras = fibras;
                clone.updatedAt = Date.now();
                return clone;
            });
            persist(newData);
        };

        const removeFibra = (sid, idx) => {
            const newData = structures.map(s => {
                if (s.id !== sid) return s;
                const clone = JSON.parse(JSON.stringify(s));
                clone.fibras = clone.fibras.filter((_,i)=>i!==idx);
                clone.updatedAt = Date.now();
                return clone;
            });
            persist(newData);
        };

        const createNew = () => {
            const s = newStructure();
            persist([s, ...structures]);
            setExpandedId(s.id);
        };

        const duplicateStructure = (origen) => {
            const copia = JSON.parse(JSON.stringify(origen));
            copia.id = 'STRUCT-' + Date.now();
            if (copia.header) {
                copia.header.status = 'BORRADOR';
                copia.header.createdAt = Date.now();
                copia.header.updatedAt = Date.now();
            }
            persist([copia, ...structures]);
            setExpandedId(copia.id);
        };

        const deleteStructure = (id) => {
            if (!window.confirm('¿Eliminar esta ficha técnica? Esta acción no se puede deshacer.')) return;
            persist(structures.filter(s => s.id !== id));
        };

        /* ── Exportación Excel ── */
        const exportExcel = () => {
            const rows = [];
            structures.forEach((s, pi) => {
                const tubos = parseInt(s.header.tubosPorDocena)||12;
                const dW = (parseFloat(s.specs.pesoUnitarioGramos)||0)*tubos;
                const maquinasS = getMaquinas(s.header);
                const maquinaPrincipal = maquinasS[0];
                s.fibras.forEach(f => {
                    const gr = dW*(f.porcentaje/100);
                    const cost = (gr/1000)*(parseFloat(f.costoKg)||0);
                    const rigid = isRigid(f);
                    const base = {
                        'PÁG': pi+1, 'PRENDA': s.nombrePrenda, 'REFERENCIA': s.header.referencia,
                        'TALLA': s.header.talla, 'ESTADO': s.status,
                        'MÁQUINA': maquinasS.map(m=>maquinaLabel(m, s.header)).join(' / '),
                        'MODELO': maquinaPrincipal.maquinaModelo,
                        'ALIMENTADORES': s.header.alimentadores||'',
                        'TUBOS/DOC': tubos,
                        ...(maquinaPrincipal.tipoMaquina==='Santoni' ? {'DIÁMETRO':maquinaPrincipal.diametro+'"'} : {}),
                        'FIBRA': f.nombre, 'TÍTULO': f.titulo,
                        'LOTE': f.lote, 'PROVEEDOR': f.proveedor,
                        '% PART.': f.porcentaje,
                        'COSTO KG (USD)': parseFloat(f.costoKg)||0,
                    };
                    if (rigid) {
                        rows.push({ ...base, 'TORSIÓN':'Rígido', 'ITEM':f.itemS,
                            'CONSUMO (g)': +gr.toFixed(2), 'COSTO DOC (USD)': +cost.toFixed(3) });
                    } else {
                        rows.push({ ...base, 'TORSIÓN':'S', 'ITEM':f.itemS,
                            'CONSUMO (g)': +(gr/2).toFixed(2), 'COSTO DOC (USD)': +(cost/2).toFixed(3) });
                        rows.push({ ...base, 'TORSIÓN':'Z', 'ITEM':f.itemZ,
                            'CONSUMO (g)': +(gr/2).toFixed(2), 'COSTO DOC (USD)': +(cost/2).toFixed(3) });
                    }
                });
            });
            if (!rows.length) { alert('No hay datos para exportar.'); return; }
            const ws = XLSX.utils.json_to_sheet(rows);
            const wb = XLSX.utils.book_new();
            const cols = Object.keys(rows[0]).map(k => ({ wch: Math.max(k.length, ...rows.map(r=>String(r[k]||'').length))+2 }));
            ws['!cols'] = cols;
            XLSX.utils.book_append_sheet(wb, ws, 'Fichas Swantex');
            XLSX.writeFile(wb, `Swantex_${new Date().toLocaleDateString('es-CO').replace(/\//g,'-')}.xlsx`);
        };

        /* ── Backup JSON ── */
        const exportBackup = () => {
            // Incluye precosteos + FT-CIR-004 + enhebrado + fechas de modificación (SWSAFE)
            if (window.SWSAFE) window.SWSAFE.descargar();
        };
        const importBackup = e => {
            // BLINDADO: ya no reemplaza nada. Fusiona con lo existente (SWSAFE),
            // guarda copia previa y solo completa/agrega datos.
            const f = e.target.files[0]; if (!f) return;
            e.target.value = '';
            if (window.SWSAFE) window.SWSAFE.importarArchivo(f);
        };

        /* ── PDF: jsPDF puro, 1 ficha = 1 hoja A4, sin html2canvas ── */
        const downloadPdf = () => {
            if (!structures.length) { alert('No hay fichas para exportar.'); return; }
            setIsExporting(true);

            setTimeout(() => {
                try {
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF({ unit:'mm', format:'a4', orientation:'portrait' });
                    const PW = 210, PH = 297;
                    const ML = 12, MR = 12, MT = 10;
                    const CW = PW - ML - MR; // usable width = 186mm

                    // ── helpers ──
                    const hex2rgb = h => {
                        const r = parseInt(h.slice(1,3),16), g = parseInt(h.slice(3,5),16), b = parseInt(h.slice(5,7),16);
                        return [r,g,b];
                    };
                    const setFill = (hex) => { const [r,g,b]=hex2rgb(hex); doc.setFillColor(r,g,b); };
                    const setDraw = (hex) => { const [r,g,b]=hex2rgb(hex); doc.setDrawColor(r,g,b); };
                    const setTxt  = (hex) => { const [r,g,b]=hex2rgb(hex); doc.setTextColor(r,g,b); };

                    const fecha = new Date().toLocaleDateString('es-CO');
                    const total = structures.length;

                    structures.forEach((s, si) => {
                        if (si > 0) doc.addPage();

                        const tubos  = parseInt(s.header.tubosPorDocena)||12;
                        const dW     = (parseFloat(s.specs.pesoUnitarioGramos)||0)*tubos;
                        const cycleS = (parseInt(s.specs.tiempoMin)||0)*60+(parseInt(s.specs.tiempoSeg)||0);
                        const docsDay= cycleS>0 ? Math.floor(86400/cycleS/tubos) : 0;
                        const totalCost = s.fibras.reduce((acc,f)=>{
                            const gr=dW*(f.porcentaje/100);
                            return acc+(gr/1000)*(parseFloat(f.costoKg)||0);
                        },0);
                        const totalPct = s.fibras.reduce((a,f)=>a+(f.porcentaje||0),0);
                        const pageNum  = si+1;

                        let y = MT;

                        // ════════════════════════════════
                        // HEADER BAR
                        // ════════════════════════════════
                        setFill('#111827'); doc.rect(ML, y, CW, 14, 'F');

                        // Logo text
                        doc.setFont('helvetica','bold'); doc.setFontSize(13);
                        setTxt('#ffffff'); doc.text('TEXTILES', ML+3, y+5.5);
                        doc.setFontSize(13); setTxt('#10b981'); doc.text('SWANTEX', ML+33, y+5.5);
                        doc.setFontSize(7); setTxt('#9ca3af'); doc.text('SAS', ML+61, y+5.5);

                        // Subtítulo
                        doc.setFont('helvetica','normal'); doc.setFontSize(6.5); setTxt('#6b7280');
                        doc.text('FICHA TÉCNICA DE INGENIERÍA', ML+3, y+10);

                        // Página y fecha (derecha)
                        doc.setFont('helvetica','bold'); doc.setFontSize(7); setTxt('#9ca3af');
                        doc.text(`Pág. ${pageNum} / ${total}   ·   ${fecha}`, PW-MR, y+5.5, {align:'right'});
                        doc.setFont('helvetica','normal'); doc.setFontSize(6); setTxt('#4b5563');
                        doc.text(s.id, PW-MR, y+10, {align:'right'});

                        // Estado badge
                        const stColors = {PENDIENTE:'#d97706',REVISIÓN:'#2563eb',APROBADO:'#059669'};
                        const stC = stColors[s.status]||'#6b7280';
                        const [sr,sg,sb]=hex2rgb(stC);
                        doc.setFillColor(sr,sg,sb); doc.roundedRect(PW-MR-22, y+10.5, 22, 4.5, 1,1,'F');
                        doc.setFont('helvetica','bold'); doc.setFontSize(5.5); setTxt('#ffffff');
                        doc.text(s.status, PW-MR-11, y+13.5, {align:'center'});

                        y += 17;

                        // ════════════════════════════════
                        // NOMBRE PRENDA
                        // ════════════════════════════════
                        doc.setFont('helvetica','bold'); doc.setFontSize(16); setTxt('#111111');
                        doc.text((s.nombrePrenda||'SIN NOMBRE').toUpperCase(), ML, y);
                        y += 5;
                        if (s.header.referencia) {
                            doc.setFont('helvetica','normal'); doc.setFontSize(7); setTxt('#6b7280');
                            doc.text('REF: '+s.header.referencia, ML, y);
                            y += 4;
                        }

                        // línea divisora
                        setDraw('#e5e7eb'); doc.setLineWidth(0.3); doc.line(ML, y, PW-MR, y);
                        y += 4;

                        // ════════════════════════════════
                        // PARÁMETROS TÉCNICOS — grid 4 columnas
                        // ════════════════════════════════
                        const params = [
                            ['Talla', s.header.talla],
                            ['Máquina', getMaquinas(s.header).map(m=>maquinaLabel(m, s.header)).join(' / ')],
                            ['Tubos/Doc', String(tubos)],
                            ['Alimentadores', String(s.header.alimentadores||'—')],
                            ['Peso Unit.', `${s.specs.pesoUnitarioGramos||0} g`],
                            ['Peso x Doc.', `${dW.toFixed(1)} g`],
                            ['Ciclo', cycleS>0?`${s.specs.tiempoMin}min ${s.specs.tiempoSeg}s`:'—'],
                            ['Cap. 24h', docsDay>0?`${docsDay} doc/día`:'—'],
                        ];
                        const cols4 = 4, boxW = CW/cols4, boxH = 9;
                        params.forEach((p, pi) => {
                            const col = pi % cols4, row = Math.floor(pi/cols4);
                            const bx = ML + col*boxW, by = y + row*boxH;
                            setFill('#f8fafc'); setDraw('#e2e8f0'); doc.setLineWidth(0.2);
                            doc.roundedRect(bx+0.5, by+0.5, boxW-1, boxH-1, 1,1,'FD');
                            doc.setFont('helvetica','normal'); doc.setFontSize(6); setTxt('#9ca3af');
                            doc.text(p[0].toUpperCase(), bx+2.5, by+3.5);
                            doc.setFont('helvetica','bold'); doc.setFontSize(8); setTxt('#111111');
                            doc.text(String(p[1]), bx+2.5, by+7.5);
                        });
                        const paramRows = Math.ceil(params.length/cols4);
                        y += paramRows*boxH + 5;

                        // ════════════════════════════════
                        // TABLA COMPOSICIÓN
                        // ════════════════════════════════
                        // Cabecera sección
                        setFill('#059669'); doc.rect(ML, y, 2.5, 5, 'F');
                        doc.setFont('helvetica','bold'); doc.setFontSize(6.5); setTxt('#374151');
                        doc.text('COMPOSICIÓN DE FIBRAS Y CONSUMO POR DOCENA', ML+4.5, y+3.5);
                        y += 7;

                        // Anchos de columna
                        const cols = [32, 30, 22, 14, 20, 42, 26];
                        const heads = ['FIBRA','TÍTULO','LOTE','PART.%','CONS.(g)','TORSIÓN / ÍTEM','COSTO/DOC'];
                        const thH = 6;

                        // Header tabla
                        setFill('#1f2937'); doc.rect(ML, y, CW, thH, 'F');
                        let cx = ML;
                        heads.forEach((h,hi) => {
                            doc.setFont('helvetica','bold'); doc.setFontSize(5.5); setTxt('#ffffff');
                            const align = hi>=3 ? 'center' : 'left';
                            const tx = align==='center' ? cx+cols[hi]/2 : cx+2;
                            doc.text(h, tx, y+4, {align});
                            cx += cols[hi];
                        });
                        y += thH;

                        // Filas fibras
                        s.fibras.forEach((f, fi) => {
                            const gr = dW*(f.porcentaje/100);
                            const cost = (gr/1000)*(parseFloat(f.costoKg)||0);
                            const rigid = isRigid(f);
                            const rowH = 7;
                            const rowBg = fi%2===0 ? '#ffffff' : '#f8fafc';
                            setFill(rowBg); setDraw('#e5e7eb'); doc.setLineWidth(0.1);
                            doc.rect(ML, y, CW, rowH, 'FD');

                            cx = ML;
                            const cells = [
                                {v:f.nombre||'—', b:true, al:'left'},
                                {v:f.titulo||'—', b:false, al:'left'},
                                {v:f.lote||'—', b:false, al:'left', sz:6},
                                {v:`${f.porcentaje}%`, b:true, al:'center', col:f.porcentaje>0?'#059669':'#dc2626'},
                                {v:gr.toFixed(1), b:true, al:'center'},
                                {v: rigid
                                    ? `[RÍG] ${f.itemS||'—'}`
                                    : `[S] ${f.itemS||'—'}   [Z] ${f.itemZ||'—'}`,
                                  b:false, al:'left', sz:6},
                                {v:`$${cost.toFixed(2)}`, b:true, al:'right', col:'#059669'},
                            ];
                            cells.forEach((c,ci) => {
                                doc.setFont('helvetica', c.b?'bold':'normal');
                                doc.setFontSize(c.sz||7); setTxt(c.col||'#111111');
                                const tx = c.al==='center' ? cx+cols[ci]/2 : c.al==='right' ? cx+cols[ci]-2 : cx+2;
                                doc.text(String(c.v), tx, y+rowH/2+1.2, {align:c.al});
                                cx += cols[ci];
                            });
                            y += rowH;
                        });

                        // Fila totales
                        const totH = 8;
                        setFill('#f0fdf4'); setDraw('#059669'); doc.setLineWidth(0.5);
                        doc.rect(ML, y, CW, totH, 'FD');
                        doc.setLineWidth(0.1);
                        // "TOTALES" label
                        doc.setFont('helvetica','bold'); doc.setFontSize(6.5); setTxt('#374151');
                        doc.text('TOTALES', ML+cols[0]+cols[1]+cols[2]-2, y+totH/2+1.2, {align:'right'});
                        // Pct total
                        const pctOk = totalPct===100;
                        doc.setFontSize(9); setTxt(pctOk?'#059669':'#dc2626');
                        doc.text(`${totalPct}%`, ML+cols[0]+cols[1]+cols[2]+cols[3]/2, y+totH/2+1.8, {align:'center'});
                        // Peso docena
                        doc.setFontSize(7); setTxt('#111111');
                        doc.text(dW.toFixed(1), ML+cols[0]+cols[1]+cols[2]+cols[3]+cols[4]/2, y+totH/2+1.2, {align:'center'});
                        // Costo total
                        doc.setFontSize(10); setTxt('#059669');
                        doc.text(`$${totalCost.toFixed(2)}`, ML+CW-2, y+totH/2+1.8, {align:'right'});
                        y += totH + 5;

                        // ════════════════════════════════
                        // PANEL INFERIOR: costo + torsiones
                        // ════════════════════════════════
                        // Box costo total
                        setFill('#f0fdf4'); setDraw('#86efac'); doc.setLineWidth(0.3);
                        doc.roundedRect(ML, y, 45, 18, 2,2,'FD');
                        doc.setFont('helvetica','bold'); doc.setFontSize(6); setTxt('#6b7280');
                        doc.text('COSTO MP / DOCENA', ML+3, y+5);
                        doc.setFontSize(15); setTxt('#059669');
                        doc.text(`$${totalCost.toFixed(2)}`, ML+3, y+13);
                        doc.setFontSize(6.5); setTxt('#6b7280');
                        doc.text(`USD · ${tubos} tubos`, ML+3, y+17);

                        // Desglose torsiones al lado
                        let tx2 = ML+48, ty2 = y;
                        doc.setFont('helvetica','bold'); doc.setFontSize(6); setTxt('#6b7280');
                        doc.text('DESGLOSE TORSIÓN S / Z POR FIBRA', tx2, ty2+4);
                        ty2 += 6;
                        let txc = tx2, tyc = ty2;
                        s.fibras.forEach((f, fi) => {
                            const gr = dW*(f.porcentaje/100);
                            const rigid = isRigid(f);
                            const lbl = f.titulo || f.nombre;
                            const bw = 60, bh = 8;
                            if (txc + bw > PW-MR) { txc = tx2; tyc += bh+2; }
                            setFill('#f8fafc'); setDraw('#e2e8f0'); doc.setLineWidth(0.2);
                            doc.roundedRect(txc, tyc, bw, bh, 1,1,'FD');
                            doc.setFont('helvetica','bold'); doc.setFontSize(6); setTxt('#111111');
                            doc.text(lbl.length>14?lbl.slice(0,14)+'…':lbl, txc+2, tyc+5);
                            if (rigid) {
                                setFill('#dcfce7'); doc.roundedRect(txc+bw-28, tyc+1.5, 9,4,1,1,'F');
                                doc.setFontSize(5); setTxt('#166534'); doc.text('RÍG', txc+bw-23.5, tyc+4.5, {align:'center'});
                                doc.setFontSize(6); setTxt('#059669'); doc.text(`${gr.toFixed(1)}g`, txc+bw-18, tyc+5);
                            } else {
                                setFill('#dbeafe'); doc.roundedRect(txc+bw-26, tyc+1.5, 6,4,1,1,'F');
                                doc.setFontSize(5); setTxt('#1e40af'); doc.text('S', txc+bw-23, tyc+4.5,{align:'center'});
                                doc.setFontSize(6); setTxt('#374151'); doc.text(`${(gr/2).toFixed(1)}g`, txc+bw-19, tyc+5);
                                setFill('#f3f4f6'); doc.roundedRect(txc+bw-12, tyc+1.5, 6,4,1,1,'F');
                                doc.setFontSize(5); setTxt('#374151'); doc.text('Z', txc+bw-9, tyc+4.5,{align:'center'});
                                doc.setFontSize(6); doc.text(`${(gr/2).toFixed(1)}g`, txc+bw-5, tyc+5);
                            }
                            txc += bw+3;
                        });
                        y += 22;

                        // ════════════════════════════════
                        // OBSERVACIONES (si las hay)
                        // ════════════════════════════════
                        if (s.observaciones && s.observaciones.trim()) {
                            y += 3;
                            setFill('#fffbeb'); setDraw('#fcd34d'); doc.setLineWidth(0.3);
                            doc.roundedRect(ML, y, CW, 14, 2,2,'FD');
                            doc.setFont('helvetica','bold'); doc.setFontSize(6); setTxt('#92400e');
                            doc.text('OBSERVACIONES', ML+3, y+4.5);
                            doc.setFont('helvetica','normal'); doc.setFontSize(7); setTxt('#374151');
                            const lines = doc.splitTextToSize(s.observaciones, CW-6);
                            doc.text(lines.slice(0,2), ML+3, y+9);
                            y += 17;
                        }

                        // ════════════════════════════════
                        // FOOTER
                        // ════════════════════════════════
                        const footerY = PH-10;
                        setDraw('#e5e7eb'); doc.setLineWidth(0.3);
                        doc.line(ML, footerY, PW-MR, footerY);
                        doc.setFont('helvetica','normal'); doc.setFontSize(6.5); setTxt('#9ca3af');
                        doc.text('Textiles Swantex SAS · Sistema de Ingeniería Textil', ML, footerY+4);
                        doc.text(`${fecha} · Pág. ${pageNum}/${total}`, PW-MR, footerY+4, {align:'right'});
                    });

                    const fname = `Swantex_Fichas_${new Date().toLocaleDateString('es-CO').replace(/\//g,'-')}.pdf`;
                    doc.save(fname);
                } catch(e) {
                    console.error(e);
                    alert('Error al generar el PDF: '+e.message);
                } finally {
                    setIsExporting(false);
                }
            }, 50);
        };

        /* ── PDF OPERARIOS v4: Compacto, sin espacios muertos ── */
        const downloadPdfOperarios = () => {
            let ft004Fichas = [];
            let enhData = {};
            try {
                ft004Fichas = JSON.parse(localStorage.getItem('swantex_ft004_v2')||'[]');
                enhData     = JSON.parse(localStorage.getItem('swantex_enh_v2')||'{}');
            } catch(e) {}
            if (!ft004Fichas.length) {
                alert('No hay fichas FT-CIR-004. Crea al menos una en esa pestaña.'); return;
            }
            setIsExporting(true);
            setTimeout(() => {
                try {
                    const TALLAS_DEF_PDF=['S','SM','M','L','L/XL','XL','XXL','3XL','Única'];
                    const { jsPDF } = window.jspdf;
                    /* Always start portrait; we add landscape page only for matrix */
                    const doc = new jsPDF({ unit:'mm', format:'a4', orientation:'portrait' });
                    const PW=210, PH=297, ML=10, MR=10, MT=8, CW=190;
                    const LW=297, LH=210, LML=10, LMR=10, LMT=8, LCW=277;
                    const fecha = new Date().toLocaleDateString('es-CO');
                    let currentFT = null;

                    /* ── draw helpers ── */
                    const h2r = h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
                    const sf  = h=>{ const[r,g,b]=h2r(h); doc.setFillColor(r,g,b); };
                    const sd  = h=>{ const[r,g,b]=h2r(h); doc.setDrawColor(r,g,b); };
                    const st  = h=>{ const[r,g,b]=h2r(h); doc.setTextColor(r,g,b); };
                    const B   = (sz,col)=>{ doc.setFont('helvetica','bold');   doc.setFontSize(sz); st(col||'#f1f5f9'); };
                    const N   = (sz,col)=>{ doc.setFont('helvetica','normal'); doc.setFontSize(sz); st(col||'#e2e8f0'); };
                    /* Centra texto vertical Y horizontalmente dentro de una celda, usando
                       baseline:'middle' de jsPDF en vez de calcular el offset a mano -
                       asi queda centrado sin importar el tamano de fuente o el contenido. */
                    const centerText = (txt,cx,cy)=>{ doc.text(txt, cx, cy, {align:'center', baseline:'middle'}); };
                    /* Insignia de torsion (S/Z) en una franja a la derecha de la celda del
                       enhebrado - mismos colores que la app: S=azul, Z=gris oscuro, sin
